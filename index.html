<title>Semester-Drill</title>

<style>
:root {
  --ground: #F5F7FA; --surface: #FFFFFF; --sunken: #EDF0F5; --ink: #16202E; --muted: #5A6576;
  --rule: #DAE0E8; --grid: #E3E9F2; --accent: #2B45B8; --accent-soft: #E6EBFA; --on-accent: #FFFFFF;
  --training: #6B3FA8; --training-soft: #EFE7F9;
  --good: #1D7A4C; --good-soft: #E2F3EA; --warn: #9A6412; --warn-soft: #FBF0DC; --bad: #B8352A; --bad-soft: #FBE7E4;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E131A; --surface: #151C26; --sunken: #1B2330; --ink: #E4E9F0; --muted: #98A3B3;
    --rule: #2A3444; --grid: #1D2633; --accent: #8FA3FF; --accent-soft: #1F2A4D; --on-accent: #0E131A;
    --good: #58C792; --good-soft: #15302A; --warn: #E3AE55; --warn-soft: #33291A; --bad: #F2796E; --bad-soft: #3A1E1E;
    --training: #C3A0F2; --training-soft: #2D2142;
  }
}
:root[data-theme="dark"] {
  --ground: #0E131A; --surface: #151C26; --sunken: #1B2330; --ink: #E4E9F0; --muted: #98A3B3;
  --rule: #2A3444; --grid: #1D2633; --accent: #8FA3FF; --accent-soft: #1F2A4D; --on-accent: #0E131A;
  --good: #58C792; --good-soft: #15302A; --warn: #E3AE55; --warn-soft: #33291A; --bad: #F2796E; --bad-soft: #3A1E1E;
  --training: #C3A0F2; --training-soft: #2D2142;
}
/* Klausurtraining: alles, was sonst Akzentblau ist, wird violett */
body[data-modus="training"] { --accent: var(--training); --accent-soft: var(--training-soft); }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-inline: 20px; padding-block: 0 64px; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.leiste { max-width: 1000px; margin: 0 auto; padding-block: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.marke { font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-decoration: none; }
.sync { font-family: var(--mono); font-size: 0.72rem; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.sync[data-art="ok"] { color: var(--good); background: var(--good-soft); }
.sync[data-art="fehler"], .sync[data-art="voll"] { color: var(--bad); background: var(--bad-soft); }
.sync[data-art="lokal"] { color: var(--warn); background: var(--warn-soft); }
main { max-width: 1000px; margin: 0 auto; padding-top: 32px; display: grid; gap: 28px; }

/* Übersicht */
.seitenkopf { display: grid; gap: 8px; }
.semwahl { display: flex; gap: 8px; flex-wrap: wrap; }
.semwahl a { font-size: .82rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); text-decoration: none; }
.semwahl a.aktiv { background: var(--accent); color: var(--on-accent); }
.woche { display: grid; gap: 8px; }
.woche-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.woche-kopf strong { font-family: var(--display); font-size: 1.35rem; }
.wochen { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
.wochen span { height: 8px; border-radius: 2px; background: var(--sunken); border: 1px solid var(--rule); }
.wochen span.vorbei { background: var(--accent); border-color: var(--accent); opacity: .45; }
.wochen span.jetzt { background: var(--accent); border-color: var(--accent); }
.hinweis-test { font-size: .88rem; color: var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 6px; }
.dash { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; align-items: start; }
.fachliste { display: grid; gap: 6px; }
.fz { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 14px; border-radius: 8px; text-decoration: none; }
a.fz:hover { background: var(--surface); box-shadow: 0 0 0 1px var(--rule); }
.fz .name { font-weight: 600; }
.fz .name small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.fz.leer .name { color: var(--muted); }
.bar { grid-column: 1 / -1; position: relative; height: 10px; background: var(--sunken); border-radius: 5px; }
.bar .ist { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 5px; }
.bar .soll { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.fz .zahlen { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-size: 0.78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip.good { color: var(--good); background: var(--good-soft); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.neutral { color: var(--muted); background: var(--sunken); }
.legende { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); padding-inline: 14px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende .l-ist { width: 14px; height: 8px; background: var(--accent); border-radius: 3px; }
.legende .l-soll { width: 2px; height: 12px; background: var(--ink); }
.heute { display: grid; gap: 10px; }
.todo { display: grid; gap: 2px; padding: 10px 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--rule); font-size: 0.92rem; text-decoration: none; }
.todo:hover { border-color: var(--accent); }
.todo.bad { border-left-color: var(--bad); }
.todo.warn { border-left-color: var(--warn); }
.todo.acc { border-left-color: var(--accent); }
.todo small { color: var(--muted); }

/* Modus */
.moduswahl { display: grid; grid-template-columns: 1fr 1fr; max-width: 560px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.moduswahl a { display: grid; gap: 1px; padding: 9px 14px; text-decoration: none; font-weight: 600; font-size: .95rem; border-left: 1px solid var(--rule); }
.moduswahl a:first-child { border-left: 0; }
.moduswahl a small { font-weight: 400; font-size: .78rem; color: var(--muted); }
.moduswahl a.aktiv { background: var(--accent); color: var(--on-accent); }
.moduswahl a.aktiv small { color: inherit; opacity: .85; }
.moduswahl a.tr:not(.aktiv) { color: var(--training); }
.zufall { display: grid; gap: 10px; padding: 14px; border-radius: 10px; background: var(--accent-soft); }
.zufall h2 { font-size: 1.1rem; }
.stufenwahl { display: flex; gap: 6px; flex-wrap: wrap; }
.stufenwahl button { font: inherit; font-size: .85rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.stufenwahl button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.zufall .los { justify-self: start; font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.fertig { display: grid; gap: 10px; justify-items: start; }

/* Fach */
.zurueck a { font-size: .9rem; color: var(--muted); text-decoration: none; }
.zurueck a:hover { color: var(--accent); }
.fach-stand { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; max-width: 560px; }
.fach-stand .zahlen { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
.blatt-block { display: grid; gap: 10px; }
.blatt-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.termine { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.themen { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.thema-zeile { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 20px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.tz-text { display: grid; gap: 2px; }
.tz-text a { font-weight: 600; text-decoration: none; }
.tz-text a:hover { color: var(--accent); }
.tz-text span { font-size: .82rem; }
.pips { display: flex; gap: 4px; }
.pip { width: 18px; height: 10px; border-radius: 2px; background: var(--sunken); border: 1px solid var(--rule); }
.pip.an { background: var(--accent); border-color: var(--accent); }
.pip.soll { border: 2px solid var(--bad); }
.knopf { font-weight: 600; font-size: .88rem; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 7px 12px; text-decoration: none; white-space: nowrap; }
.knopf:hover { filter: brightness(0.97); }

/* Thema */
.quelle { font-size: .85rem; color: var(--muted); }
.muster { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule); }
.tabs button { font: inherit; color: var(--muted); background: var(--surface); border: 0; border-right: 1px solid var(--rule); padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px; align-content: start; }
.tabs button:last-child { border-right: 0; }
.tabs button b { font-family: var(--display); font-size: 1.05rem; color: var(--ink); font-weight: 600; }
.tabs button small { font-size: 0.78rem; }
.tabs .verlauf { font-family: var(--mono); letter-spacing: .05em; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.tabs button[aria-selected="true"] small { color: var(--ink); }
.tabs .ok { color: var(--good); }
.tabs .dran { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); vertical-align: middle; }
.blatt {
  padding: 22px 20px 28px; background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
}
.panel { display: grid; gap: 16px; max-width: 72ch; }
.variante-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stufe-info { font-size: 0.8rem; font-family: var(--mono); color: var(--muted); background: var(--surface); padding: 2px 8px; border: 1px solid var(--rule); border-radius: 4px; }
.angabe, .teil { background: var(--surface); padding: 14px 16px; border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 10px; }
.formel { font-family: var(--mono); background: var(--sunken); padding: 6px 10px; border-radius: 4px; justify-self: start; }
.ersatz { font-size: 0.9rem; color: var(--muted); border-left: 3px solid var(--warn); padding-left: 10px; }
.teil label { font-weight: 500; }
.teil label .pkt { font-family: var(--mono); font-size: .78rem; color: var(--muted); margin-left: 8px; font-weight: 400; white-space: nowrap; }
.eingabe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eingabe input { font-family: var(--mono); font-size: 1rem; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; width: 12rem; max-width: 100%; }
.eingabe input.breit { width: 20rem; }
.eingabe .einheit { font-family: var(--mono); color: var(--muted); }
.auswahl { display: flex; gap: 8px; flex-wrap: wrap; }
button.wahl { font: inherit; font-size: .95rem; padding: 7px 14px; border-radius: 6px; cursor: pointer; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); text-align: left; }
button.wahl:hover { border-color: var(--accent); }
button.wahl.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
button.wahl.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
button.pruefen, button.leise { font: inherit; font-weight: 600; font-size: .9rem; border-radius: 6px; padding: 8px 14px; cursor: pointer; justify-self: start; }
button.pruefen { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
button.pruefen:hover { filter: brightness(1.08); }
button.leise { background: var(--surface); color: var(--muted); border: 1px solid var(--rule); font-weight: 500; }
.fb { font-size: 0.92rem; padding: 8px 12px; border-radius: 6px; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb.warn { background: var(--warn-soft); color: var(--warn); }
.nachbohren { font-size: .9rem; border-left: 3px solid var(--accent); padding-left: 12px; }
.loesung { font-family: var(--mono); font-size: .88rem; background: var(--sunken); padding: 8px 12px; border-radius: 6px; overflow-wrap: anywhere; }
.hinweis { font-size: .8rem; color: var(--muted); }
.ergebnis { display: grid; gap: 10px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); }
.ergebnis.good { border-color: var(--good); }
.ergebnis.bad { border-color: var(--bad); }
.ergebnis .verlauf { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
.knoepfe { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.knoepfe-es { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
figure svg { width: 100%; height: auto; display: block; }
figcaption { font-size: .78rem; color: var(--muted); padding: 2px 6px 0; }
.sk-gitter { stroke: var(--grid); stroke-width: 1; }
.sk-linie { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.sk-hilfe { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.sk-bahn { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.sk-punkt { fill: var(--accent); }
.sk-ziel { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.sk-text { fill: var(--ink); font-family: var(--mono); font-size: 12px; }
.sk-duenn { stroke: var(--muted); stroke-width: 1; }
.sk-pfeil { stroke: var(--accent); stroke-width: 2; }
.sk-pfeil-a { stroke: var(--warn); stroke-width: 2; }
.sk-mass { stroke: var(--muted); stroke-width: 1; }
.sk-spitze { fill: var(--muted); }
.sk-koerper { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.sk-hohl { fill: none; stroke: var(--accent); stroke-width: 3; }
.sk-stift { fill: var(--ink); }
.sk-flaeche { fill: var(--sunken); stroke: var(--ink); stroke-width: 1.5; }
.sk-wasser { fill: var(--accent-soft); stroke: none; }
.sk-wand { stroke: var(--ink); stroke-width: 3; fill: none; }
.sk-achse { stroke: var(--muted); stroke-width: 1.2; }
.gr { fill: none; stroke-width: 2.2; }
.gr-0 { stroke: var(--bad); } .gr-1 { stroke: var(--accent); stroke-dasharray: 7 4; } .gr-2 { stroke: var(--good); stroke-dasharray: 2 3; }
.gr-3 { stroke: var(--training); stroke-dasharray: 9 3 2 3; } .gr-4 { stroke: var(--warn); stroke-dasharray: 4 4; }
.grt-0 { fill: var(--bad); } .grt-1 { fill: var(--accent); } .grt-2 { fill: var(--good); } .grt-3 { fill: var(--training); } .grt-4 { fill: var(--warn); }
.grt { font-family: var(--mono); font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.anim { display: grid; gap: 10px; }
.anim figure svg { max-height: 70vh; touch-action: none; }
.regler { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; font-size: .88rem; color: var(--muted); }
.regler label { display: flex; gap: 8px; align-items: center; }
.regler input[type="range"] { width: 150px; accent-color: var(--accent); }
.anim-info { font-size: .92rem; min-height: 1.5em; }
.an-achse { stroke: var(--muted); stroke-width: 1; }
.an-kreis { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.an-bild { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); fill-opacity: .55; }
.an-speiche { stroke: var(--accent); stroke-width: 1; opacity: .35; }
.an-eigen { stroke: var(--good); stroke-width: 2; }
.an-eigen-text { fill: var(--good); font-family: var(--mono); font-size: 12px; }
.an-v { stroke: var(--ink); stroke-width: 2.5; }
.an-v-spitze { fill: var(--ink); }
.an-av { stroke: var(--warn); stroke-width: 2.5; }
.an-av-spitze { fill: var(--warn); }
.an-feld { stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; }
.an-loesung { stroke: var(--accent); stroke-width: 3; fill: none; }
.an-bahn { stroke: var(--warn); stroke-width: 2; fill: none; stroke-dasharray: 7 4; }
.an-start { fill: var(--warn); stroke: var(--surface); stroke-width: 2; cursor: grab; }

@media (max-width: 760px) {
  .dash { grid-template-columns: 1fr; }
  .thema-zeile { grid-template-columns: 1fr auto; }
  .thema-zeile .knopf { grid-column: 1 / -1; justify-self: start; }
  .tabs { grid-template-columns: repeat(2, 1fr); }
  .tabs button:nth-child(2) { border-right: 0; }
  .tabs button:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
}
</style>
