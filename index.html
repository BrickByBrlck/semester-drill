<script src="vendor/math.min.js"></script>
<script id="logik">
// Reine Logik ohne DOM. test_app.js lädt genau diesen Block und prüft ihn.
const Logik = (function () {
  const TOL = 0.005;

  function nah(x, ref, tol) { return Math.abs(x - ref) <= tol * Math.max(Math.abs(ref), 1e-9); }

  // "24,2 m" -> 24.2 · "1 2" -> NaN (nie still als 12 lesen)
  const HOCHZAHL = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  function leseZahl(s) {
    // 1,03·10^22, 1,03*10^(-3), 1,03 x 10²² werden zu 1,03e22
    const t = String(s).trim().replace(/−/g, '-').replace(
      /^([-+]?(?:\d+(?:[.,]\d+)?|[.,]\d+))\s*[·*×x]\s*10\s*(?:\^\s*\(?\s*([-+]?\d+)\s*\)?|([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+))/,
      (_, a, e1, e2) => a + 'e' + (e1 !== undefined ? e1 : [...e2].map(c => HOCHZAHL[c]).join('')));
    const m = t.match(/^([-+]?(?:\d+(?:[.,]\d+)?|[.,]\d+)(?:[eE][-+]?\d+)?)\s*(.*)$/);
    if (!m) return NaN;
    const rest = m[2];
    if (rest && !/^[^\d.,+\-]/.test(rest)) return NaN;
    if (/(^|\s)[\d.,]+(\s|$)/.test(rest)) return NaN;
    return Number(m[1].replace(',', '.'));
  }

  function pruefeZahl(eingabe, teil) {
    const a = teil.antwort;
    if (!String(eingabe).trim()) return { art: 'warn', text: 'Noch keine Antwort eingegeben.' };
    const x = leseZahl(eingabe);
    if (isNaN(x)) return { art: 'warn', text: 'Das lässt sich nicht als Zahl lesen. Schreib zum Beispiel 24,2 oder 24,2 m oder 1,2·10^5.' };
    if (nah(x, a.wert, a.tol)) return { art: 'good', text: 'Richtig.' };
    for (const alt of a.alternativ || []) {
      if (nah(x, alt.wert, a.tol)) return { art: 'good', ersatz: true, text: 'Richtig mit dem Ersatzwert. Volle Punkte.' };
    }
    const f = (teil.fehlwege || []).find(f => nah(x, f.wert, a.tol));
    if (f) return { art: 'bad', fehlweg: f.diagnose, text: 'Nicht richtig. ' + f.diagnose };
    return { art: 'bad', text: 'Nicht richtig. Noch ein Versuch?' };
  }

  const GRIECH = { 'α': 'alpha', 'β': 'beta', 'φ': 'phi', 'θ': 'theta', 'λ': 'lambda', 'μ': 'mu', 'ω': 'omega' };
  const TIEF = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4' };

  // Übersetzt, was jemand natürlich tippt (v₀², sin(2α), π, ω₂), in math.js-Schreibweise
  function normFormel(s, variablen) {
    let e = String(s).trim()
      .replace(/[·×]/g, '*').replace(/[−–]/g, '-').replace(/²/g, '^2').replace(/³/g, '^3')
      .replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/,/g, '.');
    const aliase = [];
    for (const v of variablen || []) {
      const zeichen = [...v.anzeige];
      const ind = zeichen.slice(1).map(c => TIEF[c] || '').join('');
      aliase.push([v.anzeige, v.name]);
      const g = GRIECH[zeichen[0]];
      if (ind) aliase.push([zeichen[0] + '_' + ind, v.name], [zeichen[0] + ind, v.name]);
      if (g) {
        if (ind) aliase.push([g + '_' + ind, v.name], [g + ind, v.name]);
        aliase.push([g, v.name], [zeichen[0], v.name]);
      }
    }
    aliase.sort((a, b) => b[0].length - a[0].length);
    for (const [von, nach] of aliase) if (von !== nach) e = e.split(von).join(nach);
    return e;
  }

  function pruefeFormel(eingabe, teil, math, zufall) {
    zufall = zufall || Math.random;
    const vars = teil.antwort.variablen;
    if (!String(eingabe).trim()) return { art: 'warn', text: 'Noch keine Formel eingegeben.' };
    if (!math) return { art: 'warn', text: 'Die Formelprüfung ist noch nicht geladen. Versuch es gleich noch einmal.' };
    let f;
    try { f = math.compile(normFormel(eingabe, vars)); }
    catch (e) { return { art: 'warn', text: 'Die Formel lässt sich nicht lesen. Beispiel für die Schreibweise: 3*x^2/(2*y)' }; }
    const punkte = Array.from({ length: 8 }, () => {
      const p = {};
      for (const v of vars) p[v.name] = v.ganz ? v.min + Math.floor(zufall() * (v.max - v.min + 1)) : v.min + zufall() * (v.max - v.min);
      return p;
    });
    let werte;
    try {
      werte = punkte.map(p => {
        const r = f.evaluate(Object.assign({}, p));
        if (typeof r !== 'number' || !isFinite(r)) throw new Error('keine Zahl');
        return r;
      });
    } catch (e) {
      const erlaubt = vars.map(v => v.name === v.anzeige ? v.name : v.name + ' (für ' + v.anzeige + ')').join(', ');
      return { art: 'warn', text: 'In der Formel steht etwas Unbekanntes. Erlaubt sind ' + erlaubt + ', dazu pi, sin, cos, tan, sqrt.' };
    }
    const passt = ausdruck => {
      const c = math.compile(ausdruck);
      return punkte.every((p, i) => nah(werte[i], c.evaluate(Object.assign({}, p)), 1e-6));
    };
    if (passt(teil.antwort.ausdruck)) return { art: 'good', text: 'Richtig.' };
    for (const fw of teil.fehlwege || []) {
      if (passt(fw.ausdruck)) return { art: 'bad', fehlweg: fw.diagnose, text: 'Nicht richtig. ' + fw.diagnose };
    }
    return { art: 'bad', text: 'Nicht richtig. Noch ein Versuch?' };
  }

  // Auswahl: angeklickt wird der Index einer Option
  function pruefeAuswahl(wahl, teil) {
    const a = teil.antwort;
    if (wahl === null || wahl === undefined || wahl === '') return { art: 'warn', text: 'Noch nichts ausgewählt.' };
    const w = Number(wahl);
    if (w === a.richtig) return { art: 'good', text: 'Richtig.' };
    const f = (teil.fehlwege || []).find(f => f.wahl === w);
    if (f) return { art: 'bad', fehlweg: f.diagnose, text: 'Nicht richtig. ' + f.diagnose };
    return { art: 'bad', text: 'Nicht richtig. Noch ein Versuch?' };
  }

  // "{1, 3, 8}", "1;3;8", "8 3 1" -> [1, 3, 8] · "{}", "∅", "leer" -> [] · Unlesbares -> null
  function leseMenge(s) {
    let t = String(s).trim().replace(/[−–]/g, '-');
    if (/^(∅|\{\s*\}|leer|leere menge)$/i.test(t)) return [];
    t = t.replace(/^\{/, '').replace(/\}$/, '').trim();
    const teile = t.split(/\s*[;,]\s*|\s+/).filter(Boolean);
    if (!teile.length || teile.some(x => !/^[-+]?\d+$/.test(x))) return null;
    return [...new Set(teile.map(Number))].sort((x, y) => x - y);
  }

  function pruefeMenge(eingabe, teil) {
    const soll = teil.antwort.elemente;
    if (!String(eingabe).trim()) return { art: 'warn', text: 'Noch keine Antwort eingegeben.' };
    const m = leseMenge(eingabe);
    if (!m) return { art: 'warn', text: 'Das lässt sich nicht als Menge lesen. Schreib zum Beispiel {1, 3, 8}, die leere Menge als {}.' };
    const gleich = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);
    if (gleich(m, soll)) return { art: 'good', text: 'Richtig.' };
    const f = (teil.fehlwege || []).find(f => gleich(m, f.menge));
    if (f) return { art: 'bad', fehlweg: f.diagnose, text: 'Nicht richtig. ' + f.diagnose };
    if (m.every(x => soll.includes(x))) return { art: 'bad', text: 'Nicht richtig. Es fehlt noch mindestens ein Element.' };
    if (soll.every(x => m.includes(x))) return { art: 'bad', text: 'Nicht richtig. Mindestens ein Element gehört nicht hinein.' };
    return { art: 'bad', text: 'Nicht richtig. Noch ein Versuch?' };
  }

  // Stufe 1–3 sitzt nach einer gelösten Variante (weitere sind freiwillig). Stufe 4 ist der Nachweis:
  // die letzten vier Varianten alle gelöst, ein Fehler setzt die Serie zurück (Vincent, 15.10.2026).
  const SERIE = 4;
  function serie(h) {
    let n = 0;
    for (let i = (h || []).length - 1; i >= 0 && h[i]; i--) n++;
    return n;
  }
  function sitzt(st, stufe) {
    if (!st) return false;
    if (Number(stufe) === 4) return serie(st.h) >= SERIE;
    return !!st.ok || (st.h || []).some(Boolean);
  }

  function istStufe(rec) {
    for (let s = 4; s >= 1; s--) if (rec && rec.st && sitzt(rec.st[s], s)) return s;
    return 0;
  }

  function plusTage(d, n) {
    const [y, m, t] = d.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, t + n)).toISOString().slice(0, 10);
  }
  function tageZwischen(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function datumKurz(d) { const [, m, t] = d.split('-'); return t + '.' + m + '.'; }
  function vorTagen(n) { return n <= 0 ? 'heute' : n === 1 ? 'gestern' : 'vor ' + n + ' Tagen'; }

  // Soll: Stufe 1 zwei Tage nach dem Blatt, Stufe 2 zur Abgabe, Stufe 3 zwei Wochen danach,
  // Stufe 4 ab zwei Wochen vor der Klausur
  function sollStufe(blatt, klausur, heute) {
    if (!blatt) return 0;
    // Klausurthemen aus Altklausuren haben keinen Blatt-Termin: im Soll erst in der Klausurphase
    if (!blatt.veroeffentlicht) return klausur && heute >= plusTage(klausur, -14) ? 4 : 0;
    if (heute < plusTage(blatt.veroeffentlicht, 2)) return 0;
    let s = 1;
    if (blatt.abgabe && heute >= blatt.abgabe) s = 2;
    if (blatt.abgabe && heute >= plusTage(blatt.abgabe, 14)) s = 3;
    if (klausur && heute >= plusTage(klausur, -14)) s = 4;
    return s;
  }

  function maxStufe(daten, id) {
    return Math.max(...Object.keys(daten.themen[id].stufen).map(Number));
  }

  // Modus "pflicht": Blatt-Themen, dazu Klausurthemen erst, wenn sie ein Soll haben (Klausurphase).
  // Modus "training": nur Klausurthemen aus Altklausuren. Ohne Modus: alles.
  function imModus(e, modus) {
    if (modus === 'pflicht') return !!e.blatt.veroeffentlicht || e.soll > 0;
    if (modus === 'training') return !e.blatt.veroeffentlicht;
    return true;
  }

  function fachStand(fach, daten, stand, heute, modus) {
    const eintraege = [];
    for (const b of fach.blaetter) for (const id of b.themen) {
      const max = maxStufe(daten, id);
      const e = { id, titel: daten.themen[id].titel, blatt: b, max, ist: istStufe(stand[id]), soll: Math.min(sollStufe(b, fach.klausur, heute), max) };
      if (imModus(e, modus)) eintraege.push(e);
    }
    const n = eintraege.length;
    if (!n) return { leer: true, eintraege, n: 0 };
    // Pro Thema erst auf dessen eigener Stufenskala normieren (Vorkurs hat nur Stufe 1, Physik vier), dann mitteln
    const ist = eintraege.reduce((s, e) => s + e.ist / e.max, 0) / n;
    const soll = eintraege.reduce((s, e) => s + e.soll / e.max, 0) / n;
    const hinten = eintraege.filter(e => e.ist < e.soll);
    let status;
    if (!hinten.length) status = { art: 'good', text: ist - soll >= 0.10 ? 'voraus' : 'im Soll' };
    else if (hinten.length <= 2) status = { art: 'warn', text: hinten.length + (hinten.length === 1 ? ' Thema hinten' : ' Themen hinten') };
    else status = { art: 'bad', text: hinten.length + ' Themen hinten' };
    return { leer: false, eintraege, n, ist, soll, hinten, status, imSoll: n - hinten.length };
  }

  function heuteDran(daten, stand, heute, faecher, modus) {
    const staende = faecher.map(f => ({ f, st: fachStand(f, daten, stand, heute, modus) }));
    const rueck = [], wdh = [];
    for (const { f, st } of staende) for (const e of st.eintraege) {
      const rec = stand[e.id];
      if (e.ist < e.soll) {
        const info = !e.blatt.veroeffentlicht
          ? 'Klausurthema, die Klausur ist in weniger als zwei Wochen · du stehst auf Stufe ' + e.ist
          : e.soll >= 2 && e.blatt.abgabe
          ? 'Blatt ' + e.blatt.nr + ', Abgabe war am ' + datumKurz(e.blatt.abgabe) + ' · du stehst auf Stufe ' + e.ist
          : 'Blatt ' + e.blatt.nr + ' ist seit ' + tageZwischen(e.blatt.veroeffentlicht, heute) + ' Tagen draußen · du stehst auf Stufe ' + e.ist;
        rueck.push({ art: 'bad', thema: e.id, stufe: e.ist + 1, luecke: e.soll - e.ist, titel: f.kurz + ' · ' + e.titel + ' auf Stufe ' + e.soll + ' bringen', info });
      } else if (e.ist > 0 && rec && rec.faellig && rec.faellig <= heute) {
        wdh.push({ art: 'warn', thema: e.id, stufe: e.ist, titel: 'Wiederholung: ' + f.kurz + ' · ' + e.titel, info: 'Stufe ' + e.ist + ' · zuletzt geübt ' + vorTagen(tageZwischen(rec.zuletzt, heute)) });
      }
    }
    rueck.sort((a, b) => b.luecke - a.luecke);
    const liste = rueck.concat(wdh);
    if (!liste.length && modus !== 'pflicht') {
      const kandidaten = staende.filter(x => !x.st.leer).sort((a, b) => (a.st.ist - a.st.soll) - (b.st.ist - b.st.soll));
      for (const { f, st } of kandidaten) {
        const e = st.eintraege.find(e => e.ist < e.max);
        if (e) {
          liste.push({ art: 'acc', thema: e.id, stufe: e.ist + 1, titel: 'Weiter: ' + f.kurz + ' · ' + e.titel + ', Stufe ' + (e.ist + 1), info: 'Du bist überall im Soll. Das hier bringt dich voran.' });
          break;
        }
      }
    }
    return liste.slice(0, 6);
  }

  // Klausurtraining: zufälliges Thema, schwache Themen öfter. stufe 1–4 fest oder 0 = jeweils die nächste
  // offene Stufe des Themas. Bei fester Stufe kommen Themen, in denen sie noch nicht sitzt, viermal so oft.
  function zufallsAufgabe(daten, stand, faecher, stufe, zufall) {
    const rnd = zufall || Math.random;
    const kand = [];
    for (const f of faecher) for (const b of f.blaetter) if (!b.veroeffentlicht) for (const id of b.themen) {
      const max = maxStufe(daten, id), rec = stand[id], ist = istStufe(rec);
      const s = stufe ? Math.min(stufe, max) : Math.min(ist + 1, max);
      const offen = !sitzt(rec && rec.st && rec.st[s], s);
      kand.push({ thema: id, stufe: s, fach: f.kurz, gewicht: stufe ? (offen ? 4 : 1) : (max - ist + 1) ** 2 });
    }
    if (!kand.length) return null;
    let x = rnd() * kand.reduce((a, k) => a + k.gewicht, 0);
    for (const k of kand) { x -= k.gewicht; if (x < 0) return k; }
    return kand[kand.length - 1];
  }

  // Trägt eine abgeschlossene Variante ein und plant die nächste Wiederholung
  function verbuche(rec, stufe, ok, heute) {
    const r = rec ? JSON.parse(JSON.stringify(rec)) : {};
    r.st = r.st || {};
    const vorher = istStufe(r);
    const warFaellig = !!(r.faellig && r.faellig <= heute);
    const st = r.st[stufe] || { h: [], n: 0 };
    st.h = (st.h || []).concat(ok ? 1 : 0).slice(-SERIE);
    st.n = (st.n || 0) + 1;
    if (ok) st.ok = 1;
    r.st[stufe] = st;
    r.zuletzt = heute;
    const nachher = istStufe(r);
    if (nachher > vorher) { r.iv = 7; r.faellig = plusTage(heute, 7); }
    else if (warFaellig && vorher > 0 && Number(stufe) >= vorher) {
      if (ok) { r.iv = Math.min((r.iv || 7) * 2, 56); r.faellig = plusTage(heute, r.iv); }
      else { r.iv = 7; r.faellig = plusTage(heute, 2); }
    }
    if (nachher === 0) { r.faellig = null; r.iv = null; }
    return r;
  }

  function zaehler(rec) {
    return rec && rec.st ? Object.values(rec.st).reduce((s, x) => s + (x.n || 0), 0) : 0;
  }

  // Pro Thema gewinnt der Stand mit mehr geübten Varianten, bei Gleichstand die Datenbank
  function mergeStand(lokal, fern) {
    const stand = Object.assign({}, fern || {});
    let fernVeraltet = false;
    for (const [id, rec] of Object.entries(lokal || {})) {
      if (zaehler(rec) > zaehler(stand[id])) { stand[id] = rec; fernVeraltet = true; }
    }
    return { stand, fernVeraltet };
  }

  // ---- Rechnungen hinter den Animationen

  // Eigenwerte (aufsteigend) und normierte Eigenvektoren (erste Komponente ≥ 0) einer reellen 2×2-Matrix,
  // null bei komplexen Eigenwerten
  function eigen2(A) {
    const [[a, b], [c, d]] = A;
    const m = (a + d) / 2, disk = ((a - d) / 2) ** 2 + b * c;
    if (disk < -1e-12) return null;
    const w = Math.sqrt(Math.max(disk, 0));
    const werte = [m - w, m + w];
    const vektoren = werte.map(l => {
      // (A − λ·1)v = 0: aus der ersten Zeile folgt v ∝ (b, λ − a), aus der zweiten v ∝ (λ − d, c)
      let v = Math.hypot(b, l - a) >= Math.hypot(l - d, c) ? [b, l - a] : [l - d, c];
      if (Math.hypot(v[0], v[1]) < 1e-12) v = [1, 0];      // A = λ·1: jede Richtung ist Eigenrichtung
      const n = Math.hypot(v[0], v[1]);
      v = [v[0] / n, v[1] / n];
      return v[0] < 0 || (v[0] === 0 && v[1] < 0) ? [-v[0], -v[1]] : v;
    });
    return { werte, vektoren };
  }

  // Lösung von y′ = f(x, y) durch (x0, y0) mit Runge-Kutta 4 bis x1 (x1 < x0 rechnet rückwärts).
  // Bricht ab, wenn y nicht mehr endlich ist, über grenze steigt oder in einem Schritt um mehr als
  // grenze/20 springt (dann liegt ein Pol dazwischen); abbruch nennt die letzte gültige Stelle.
  function rk4Bahn(f, x0, y0, x1, schritte, grenze) {
    const h = (x1 - x0) / schritte, punkte = [[x0, y0]];
    let x = x0, y = y0;
    for (let i = 0; i < schritte; i++) {
      const k1 = f(x, y), k2 = f(x + h / 2, y + h / 2 * k1), k3 = f(x + h / 2, y + h / 2 * k2), k4 = f(x + h, y + h * k3);
      const yn = y + h / 6 * (k1 + 2 * k2 + 2 * k3 + k4);
      if (!Number.isFinite(yn) || Math.abs(yn) > grenze || Math.abs(yn - y) > grenze / 20) return { punkte, abbruch: x };
      x = x0 + (i + 1) * h;
      y = yn;
      punkte.push([x, y]);
    }
    return { punkte, abbruch: null };
  }

  // y-Bereich für einen Plot: mittlere 90 % der Werte plus Pflichtwerte, mit Rand
  function yFenster(werte, pflicht) {
    const w = werte.filter(Number.isFinite).sort((p, q) => p - q);
    let lo = Math.min(...pflicht), hi = Math.max(...pflicht);
    if (w.length) {
      lo = Math.min(lo, w[Math.floor(0.05 * (w.length - 1))]);
      hi = Math.max(hi, w[Math.ceil(0.95 * (w.length - 1))]);
    }
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const rand = 0.15 * (hi - lo);
    return [lo - rand, hi + rand];
  }

  return { TOL, nah, leseZahl, pruefeZahl, normFormel, pruefeFormel, pruefeAuswahl, leseMenge, pruefeMenge,sitzt, serie, istStufe, maxStufe, zufallsAufgabe, plusTage, tageZwischen,
    datumKurz, vorTagen, sollStufe, fachStand, heuteDran, verbuche, mergeStand, eigen2, rk4Bahn, yFenster };
})();
</script>
<script>
(function () {
  'use strict';
  const L = Logik;
  const DATEN = JSON.parse(document.getElementById('daten').textContent);
  const STUFEN = { 1: 'Einstieg · Formel gegeben', 2: 'Übung · Formel selbst wählen', 3: 'Blattniveau', 4: 'Klausur · verkettet' };
  // Web-Version (build.py --web): window.WEB meldet an und liefert eine Datenbank mit derselben Schnittstelle
  const WEB = window.WEB || null;
  let LS_KEY = 'semester-drill-stand-v1';
  const app = document.getElementById('app');
  const uebersprungen = {};
  let stand = WEB ? {} : ladeLokal() || {};
  let db = null;
  let letzteRoute = null;
  let eingabeAktiv = false;
  let zufallWahl = null;   // gesetzt, wenn die Aufgabe über „Zufällige Aufgabe“ kam (0 = gemischt, sonst Stufe)
  const LS_ZUFALL = 'semester-drill-zufall-stufe';
  function setzeModus(m) { document.body.dataset.modus = m; }
  const modusVonThema = id => { const o = ortVon(id); return o && !o.b.veroeffentlicht ? 'training' : 'pflicht'; };
  const hatTraining = faecher => faecher.some(f => f.blaetter.some(b => !b.veroeffentlicht && b.themen.length));
  function zufallStarten(wahl) {
    const sem = DATEN.semester.find(s => s.id === DATEN.standard);
    const z = L.zufallsAufgabe(DATEN, stand, sem.faecher, wahl);
    if (z) location.hash = '#/thema/' + z.thema + '/' + z.stufe + '/zufall/' + wahl;
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const prozent = x => Math.round(x * 100);
  function heute() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const alleFaecher = () => DATEN.semester.flatMap(s => s.faecher);
  const fachVon = id => alleFaecher().find(f => f.id === id);
  const semesterVon = fachId => DATEN.semester.find(s => s.faecher.some(f => f.id === fachId));
  function ortVon(themaId) {
    for (const f of alleFaecher()) for (const b of f.blaetter) if (b.themen.includes(themaId)) return { f, b };
    return null;
  }

  // ---------------------------------------------------------------- Speichern

  function ladeLokal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
  function speichereLokal() { try { localStorage.setItem(LS_KEY, JSON.stringify(stand)); } catch (e) { /* privates Fenster */ } }

  function setSync(art, err) {
    const texte = { lade: 'Stand wird geladen', ok: WEB ? 'Gespeichert' : 'Stand synchronisiert', lokal: 'Stand nur in diesem Browser', fehler: 'Speichern fehlgeschlagen', voll: 'Datenbank voll' };
    const el = document.getElementById('sync');
    el.dataset.art = art;
    el.textContent = texte[art];
    el.title = err && err.message ? err.message : '';
  }

  async function verbinde() {
    if (WEB) {
      setSync('lade');
      const k = await WEB.anmeldung();           // wartet, bis jemand mit Google angemeldet ist
      LS_KEY += '-' + k.uid;                     // Zwischenspeicher pro Konto, falls sich zwei einen Laptop teilen
      stand = ladeLokal() || {};
      db = k.db;
      await holeStand();
      return;
    }
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('lokal'); return; }
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { setSync('lokal'); return; }
    await holeStand();
  }

  async function holeStand() {
    try {
      const ref = db.doc('stand/themen');
      const snap = await ref.get();
      const fern = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {};
      const m = L.mergeStand(stand, fern);
      stand = m.stand;
      speichereLokal();
      if (m.fernVeraltet || !snap.exists) await ref.set(stand);
      setSync('ok');
      datenGeaendert();
    } catch (e) {
      setSync(e && (e.code === 'quota_exceeded' || e.code === 'resource-exhausted') ? 'voll' : 'fehler', e);
    }
  }

  async function speichereThema(id) {
    speichereLokal();
    if (!db) return;
    const ref = db.doc('stand/themen');
    try {
      await ref.update({ [id]: stand[id] });
      setSync('ok');
    } catch (e) {
      try { await ref.set(stand); setSync('ok'); }
      catch (e2) { setSync(e2 && (e2.code === 'quota_exceeded' || e2.code === 'resource-exhausted') ? 'voll' : 'fehler', e2); }
    }
  }

  // Ein Dokument pro Tag, damit die Pipeline später Trefferquoten und Fehlwege auslesen kann
  async function logVersuch(eintrag) {
    if (!db) return;
    const ref = db.doc('versuche/' + heute());
    try {
      const snap = await ref.get();
      const e = snap.exists ? (snap.data().e || []).slice() : [];
      e.push(eintrag);
      await ref.set({ e });
    } catch (err) { /* Protokoll ist nice to have, der Stand ist schon gespeichert */ }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && db) holeStand(); });

  // ---------------------------------------------------------------- Routen

  function route() {
    const teile = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const schluessel = teile.join('/');
    const neu = schluessel !== letzteRoute;
    letzteRoute = schluessel;
    zufallWahl = null;
    if (teile[0] === 'fach' && fachVon(teile[1])) renderFach(fachVon(teile[1]), teile[2] === 'training' ? 'training' : 'pflicht');
    else if (teile[0] === 'thema' && DATEN.themen[teile[1]]) {
      if (teile[3] === 'zufall') zufallWahl = Number(teile[4]) || 0;
      renderThema(teile[1], Number(teile[2]));
    }
    else if (teile[0] === 'sem' && DATEN.semester.some(s => s.id === teile[1])) renderUebersicht(teile[1], teile[2] === 'training' ? 'training' : 'pflicht');
    else if (teile[0] === 'rangliste' && WEB && WEB.rangliste) WEB.rangliste(document.getElementById('app'));   // nur Web-Version
    else renderUebersicht(DATEN.standard, 'pflicht');
    if (WEB && WEB.nachRoute) WEB.nachRoute(teile[0] || '');    // Web-Version: Seitenleiste nur außerhalb von Aufgaben
    if (neu) window.scrollTo(0, 0);
  }

  function datenGeaendert() {
    if (letzteRoute && letzteRoute.startsWith('thema/') && eingabeAktiv) return;
    const y = window.scrollY;
    route();
    window.scrollTo(0, y);
  }

  window.addEventListener('hashchange', route);

  // ---------------------------------------------------------------- Übersicht

  function balken(st) {
    return `<div class="bar" role="img" aria-label="erreicht ${prozent(st.ist)} %, Soll ${prozent(st.soll)} %"><div class="ist" style="width:${prozent(st.ist)}%"></div><div class="soll" style="left:${prozent(st.soll)}%"></div></div>`;
  }

  function fachZeile(f, st, modus) {
    const name = `<span class="name">${esc(f.kurz)}<small>${esc(f.name)}</small></span>`;
    if (st.leer) {
      const text = modus === 'pflicht' ? (f.hinweis && !f.blaetter.some(b => b.themen.length) ? f.hinweis : 'Kommt, sobald das erste Übungsblatt da ist.')
        : (f.hinweis || 'Wird gefüllt, sobald der Moodle-Raum offen ist.');
      return `<div class="fz leer">${name}<span class="chip neutral">${modus === 'pflicht' ? 'noch kein Blatt' : 'noch leer'}</span><span class="zahlen">${esc(text)}</span></div>`;
    }
    if (modus === 'training') {
      const sicher = st.eintraege.filter(e => e.ist >= e.max).length;
      return `<a class="fz" href="#/fach/${f.id}/training">${name}<span class="chip neutral">${sicher} von ${st.n} sicher</span>
        <div class="bar" role="img" aria-label="erreicht ${prozent(st.ist)} %"><div class="ist" style="width:${prozent(st.ist)}%"></div></div>
        <span class="zahlen">${st.n} Themen · erreicht ${prozent(st.ist)} %${st.soll > 0 ? ' · Klausurphase, Soll ' + prozent(st.soll) + ' %' : ''}</span></a>`;
    }
    return `<a class="fz" href="#/fach/${f.id}">${name}<span class="chip ${st.status.art}">${esc(st.status.text)}</span>${balken(st)}
      <span class="zahlen">${st.imSoll} von ${st.n} Themen im Soll · erreicht ${prozent(st.ist)} % · Soll ${prozent(st.soll)} %${f.test ? ' · Testinhalt' : ''}</span></a>`;
  }

  function moduswahl(sem, modus) {
    if (!hatTraining(sem.faecher)) return '';
    return `<nav class="moduswahl" aria-label="Modus">
      <a class="${modus === 'pflicht' ? 'aktiv' : ''}" href="#/sem/${sem.id}"${modus === 'pflicht' ? ' aria-current="page"' : ''}>Pflicht<small>was gerade dran ist</small></a>
      <a class="tr ${modus === 'training' ? 'aktiv' : ''}" href="#/sem/${sem.id}/training"${modus === 'training' ? ' aria-current="page"' : ''}>Klausurtraining<small>freiwillig, nach Altklausuren</small></a></nav>`;
  }

  function renderUebersicht(semId, modus) {
    const h = heute(), sem = DATEN.semester.find(s => s.id === semId) || DATEN.semester.find(s => s.id === DATEN.standard);
    if (modus === 'training' && hatTraining(sem.faecher)) return renderTraining(sem, h);
    setzeModus('pflicht');
    renderPflicht(sem, h);
  }

  // Ohne Klausurthemen (Vorkurs) gibt es keine Modi, dann zählt alles wie bisher
  function renderPflicht(sem, h) {
    const modus = hatTraining(sem.faecher) ? 'pflicht' : undefined;
    const staende = sem.faecher.map(f => ({ f, st: L.fachStand(f, DATEN, stand, h, modus) }));
    const voll = staende.filter(x => !x.st.leer);
    const nGes = voll.reduce((s, x) => s + x.st.n, 0);
    const istGes = nGes ? voll.reduce((s, x) => s + x.st.ist * x.st.n, 0) / nGes : 0;
    const sollGes = nGes ? voll.reduce((s, x) => s + x.st.soll * x.st.n, 0) / nGes : 0;
    const wochen = Math.ceil((L.tageZwischen(sem.vorlesungsbeginn, sem.vorlesungsende) + 1) / 7);
    const vorStart = h < sem.vorlesungsbeginn;
    const woche = vorStart ? 0 : Math.min(wochen, Math.floor(L.tageZwischen(sem.vorlesungsbeginn, h) / 7) + 1);
    const wocheText = vorStart ? 'Vorlesungsbeginn in ' + L.tageZwischen(h, sem.vorlesungsbeginn) + ' Tagen'
      : h > sem.vorlesungsende ? 'Vorlesungszeit vorbei' : 'Woche ' + woche + ' von ' + wochen;
    const segmente = Array.from({ length: wochen }, (_, i) => `<span class="${i + 1 < woche ? 'vorbei' : i + 1 === woche ? 'jetzt' : ''}"></span>`).join('');
    const dran = L.heuteDran(DATEN, stand, h, sem.faecher, modus);
    const test = sem.faecher.filter(f => f.test);
    const semwahl = DATEN.semester.length < 2 ? '' : `<nav class="semwahl" aria-label="Semester">${DATEN.semester.map(s => `<a class="${s.id === sem.id ? 'aktiv' : ''}" href="#/sem/${s.id}">${esc(s.kurz)}</a>`).join('')}</nav>`;

    app.innerHTML = `
      <header class="seitenkopf">${semwahl}<p class="eyebrow">${esc(sem.name)}</p><h1>${modus ? 'Was gerade dran ist' : 'Wo du im Semester stehst'}</h1></header>
      ${moduswahl(sem, 'pflicht')}
      <section class="woche" aria-label="Semesterwoche">
        <div class="woche-kopf"><strong>${wocheText}</strong><span class="muted">Gesamt ${prozent(istGes)} % · Soll ${prozent(sollGes)} %</span></div>
        <div class="wochen" style="--n:${wochen}" aria-hidden="true">${segmente}</div>
      </section>
      ${test.length ? `<p class="hinweis-test">${test.map(f => esc(f.kurz) + ': ' + esc(f.test)).join(' ')}</p>` : ''}
      <div class="dash">
        <section class="fachliste" aria-label="Fächer">
          ${staende.map(x => fachZeile(x.f, x.st, modus)).join('')}
          <div class="legende"><span><i class="l-ist"></i>erreicht</span><span><i class="l-soll"></i>Soll zum heutigen Tag</span></div>
        </section>
        <section class="heute">
          <h2>Heute dran</h2>
          ${dran.length ? dran.map(d => `<a class="todo ${d.art}" href="#/thema/${d.thema}/${d.stufe}"><span>${esc(d.titel)}</span><small>${esc(d.info)}</small></a>`).join('')
            : modus ? `<div class="fertig"><p>Alles erledigt, was gerade dran ist.</p><a class="knopf" href="#/sem/${sem.id}/training">Zum Klausurtraining</a></div>`
            : '<p class="muted">Du bist überall durch.</p>'}
        </section>
      </div>`;
  }

  function renderTraining(sem, h) {
    setzeModus('training');
    const staende = sem.faecher.map(f => ({ f, st: L.fachStand(f, DATEN, stand, h, 'training') }));
    let wahl = 0;
    try { wahl = Number(localStorage.getItem(LS_ZUFALL)) || 0; } catch (e) { /* ohne Speicher: gemischt */ }
    // Vorschläge: fällige Wiederholungen, dann die schwächsten Themen, abwechselnd aus den Fächern
    const wdh = L.heuteDran(DATEN, stand, h, sem.faecher, 'training').filter(d => d.art !== 'acc');
    const proFach = staende.filter(x => !x.st.leer).map(x => x.st.eintraege.filter(e => e.ist < e.max)
      .sort((a, b) => a.ist / a.max - b.ist / b.max).map(e => ({ f: x.f, e })));
    const schwach = [];
    for (let i = 0; schwach.length < 4 && proFach.some(l => l[i]); i++) for (const l of proFach) if (l[i] && schwach.length < 4) schwach.push(l[i]);
    const vorschlaege = wdh.slice(0, 3).map(d => `<a class="todo ${d.art}" href="#/thema/${d.thema}/${d.stufe}"><span>${esc(d.titel)}</span><small>${esc(d.info)}</small></a>`)
      .concat(schwach.map(({ f, e }) => `<a class="todo acc" href="#/thema/${e.id}/${Math.min(e.ist + 1, e.max)}"><span>${esc(f.kurz)} · ${esc(e.titel)}</span><small>${e.ist ? 'Stufe ' + e.ist + ' sitzt · weiter mit Stufe ' + (e.ist + 1) : 'noch nicht angefangen'}</small></a>`));
    const knopf = (w, t) => `<button type="button" data-wahl="${w}" aria-pressed="${w === wahl}">${t}</button>`;
    app.innerHTML = `
      <header class="seitenkopf"><p class="eyebrow">${esc(sem.name)} · freiwillig</p><h1>Klausurtraining</h1>
        <p class="muted">Aufgaben im Stil der Altklausuren. Kein Soll bis zwei Wochen vor der Klausur. Ein Thema ist sicher, wenn du Stufe 4 viermal am Stück löst.</p></header>
      ${moduswahl(sem, 'training')}
      <div class="dash">
        <section class="fachliste" aria-label="Fächer">
          ${staende.map(x => fachZeile(x.f, x.st, 'training')).join('')}
        </section>
        <section class="heute">
          <div class="zufall">
            <h2>Zufällige Aufgabe</h2>
            <div class="stufenwahl" role="group" aria-label="Stufe">${knopf(0, 'gemischt')}${[1, 2, 3, 4].map(s => knopf(s, 'Stufe ' + s)).join('')}</div>
            <button type="button" class="los" id="zufall-los">Los</button>
            <small class="muted">${wahl ? 'Bevorzugt Themen, in denen Stufe ' + wahl + ' noch nicht sitzt.' : 'Jeweils die nächste offene Stufe, schwache Themen öfter.'}</small>
          </div>
          <h2>Vorschläge</h2>
          ${vorschlaege.length ? vorschlaege.join('') : '<p class="muted">Alle Klausurthemen sind sicher.</p>'}
        </section>
      </div>`;
    app.querySelectorAll('.stufenwahl button').forEach(b => b.addEventListener('click', () => {
      try { localStorage.setItem(LS_ZUFALL, b.dataset.wahl); } catch (e) { /* egal */ }
      renderTraining(sem, h);
    }));
    app.querySelector('#zufall-los').addEventListener('click', () => zufallStarten(wahl));
  }

  // ---------------------------------------------------------------- Fach

  function renderFach(f, modusWunsch) {
    const sem = semesterVon(f.id);
    const mitModi = !!sem && hatTraining(sem.faecher);
    const modus = mitModi ? modusWunsch : undefined;
    setzeModus(modus === 'training' ? 'training' : 'pflicht');
    const h = heute(), st = L.fachStand(f, DATEN, stand, h, modus);
    const semLink = '#/sem/' + (sem ? sem.id : DATEN.standard) + (modus === 'training' ? '/training' : '');
    const anderer = !mitModi ? '' : modus === 'training'
      ? `<a class="knopf" href="#/fach/${f.id}">Übungsblätter in ${esc(f.kurz)}</a>` : `<a class="knopf" href="#/fach/${f.id}/training">Klausurtraining in ${esc(f.kurz)}</a>`;
    const kopf = `<nav class="zurueck"><a href="${semLink}">← ${modus === 'training' ? 'Klausurtraining' : 'Übersicht'}</a></nav>
      <header class="seitenkopf"><p class="eyebrow">${esc(f.kurz)}${modus === 'training' ? ' · Klausurtraining, freiwillig' : modus ? ' · Übungsblätter' : ''}</p><h1>${esc(f.name)}</h1>${f.test ? `<p class="hinweis-test">${esc(f.test)}</p>` : ''}</header>`;
    if (st.leer) {
      app.innerHTML = kopf + `<p class="muted">${modus === 'training' ? 'Noch keine Klausurthemen.' : 'Noch keine Blätter. ' + esc(f.hinweis || 'Sie kommen, sobald das erste Blatt da ist.')}</p>${anderer ? `<p>${anderer}</p>` : ''}`;
      return;
    }
    const blaetter = f.blaetter.filter(b => st.eintraege.some(e => e.blatt === b));
    const standZeile = modus === 'training'
      ? `<div class="fach-stand"><div class="bar"><div class="ist" style="width:${prozent(st.ist)}%"></div></div><span class="zahlen">${st.eintraege.filter(e => e.ist >= e.max).length} von ${st.n} Themen sicher · erreicht ${prozent(st.ist)} %</span></div>`
      : `<div class="fach-stand">${balken(st)}<span class="zahlen">${st.imSoll} von ${st.n} Themen im Soll · erreicht ${prozent(st.ist)} % · Soll ${prozent(st.soll)} %</span></div>`;
    app.innerHTML = kopf + standZeile + `
      ${blaetter.map(b => `
        <section class="blatt-block">
          <div class="blatt-kopf"><h2>${b.veroeffentlicht ? 'Blatt ' + b.nr + ' · ' : ''}${esc(b.titel)}</h2><span class="termine">${b.veroeffentlicht ? 'ab ' + L.datumKurz(b.veroeffentlicht) + (b.abgabe ? ' · Abgabe ' + L.datumKurz(b.abgabe) : '') : 'Aufgaben nach Altklausuren · Soll erst zur Klausur'}</span></div>
          <ul class="themen">${b.themen.map(id => st.eintraege.find(e => e.id === id)).filter(Boolean).map(themaZeile).join('')}</ul>
        </section>`).join('')}
      ${anderer ? `<p>${anderer}</p>` : ''}`;
  }

  function themaZeile(e) {
    if (e.max === 1) {
      const fertig = e.ist >= 1;
      return `<li class="thema-zeile">
        <div class="tz-text"><a href="#/thema/${e.id}">${esc(e.titel)}</a><span class="muted">${fertig ? 'Gemacht' : 'Noch offen'}</span></div>
        <span class="chip ${fertig ? 'good' : 'neutral'}">${fertig ? 'erledigt' : 'offen'}</span>
        <a class="knopf" href="#/thema/${e.id}/1">${fertig ? 'Noch mal ansehen' : 'Diagnose machen'}</a></li>`;
    }
    const pips = Array.from({ length: e.max }, (_, i) => i + 1)
      .map(s => `<span class="pip${s <= e.ist ? ' an' : ''}${s === e.soll && e.soll > e.ist ? ' soll' : ''}"></span>`).join('');
    const naechste = Math.min(e.ist + 1, e.max);
    return `<li class="thema-zeile">
      <div class="tz-text"><a href="#/thema/${e.id}">${esc(e.titel)}</a><span class="muted">Stufe ${e.ist} von ${e.max}${e.soll ? ' · Soll ' + e.soll : ''}</span></div>
      <span class="pips" role="img" aria-label="Stufe ${e.ist} von ${e.max}${e.soll ? ', Soll ' + e.soll : ''}">${pips}</span>
      <a class="knopf" href="#/thema/${e.id}/${naechste}">Stufe ${naechste} üben</a></li>`;
  }

  // ---------------------------------------------------------------- Thema

  function renderThema(id, wunsch) {
    const th = DATEN.themen[id], ort = ortVon(id);
    const stufenListe = Object.keys(th.stufen).map(Number).sort((a, b) => a - b);
    const max = stufenListe[stufenListe.length - 1];
    const ist = L.istStufe(stand[id]);
    const stufe = stufenListe.includes(wunsch) ? wunsch : Math.min(ist + 1, max);
    setzeModus(modusVonThema(id));
    app.innerHTML = `
      <nav class="zurueck"><a href="#/fach/${ort.f.id}${modusVonThema(id) === 'training' ? '/training' : ''}">← ${esc(ort.f.name)}</a></nav>
      <header class="seitenkopf"><p class="eyebrow">${esc(ort.f.kurz)} · ${ort.b.veroeffentlicht ? 'Blatt ' + ort.b.nr : 'Klausurtraining'}${zufallWahl !== null ? ' · zufällige Aufgabe' : ''}</p><h1>${esc(th.titel)}</h1>${th.skript ? `<p class="quelle">Im Skript: ${esc(th.skript)}</p>` : ''}<p class="quelle">${esc(th.quelle)}</p></header>
      <div class="muster">
        ${max > 1 ? '<div class="tabs" role="tablist" aria-label="Schwierigkeitsstufen"></div>' : ''}
        <div class="blatt" id="panel" role="tabpanel"${max > 1 ? ` aria-labelledby="tab-${stufe}"` : ''}></div>
      </div>`;
    if (max > 1) zeichneTabs(id, stufe);
    renderVariante(id, stufe);
  }

  // Nur für Themen mit mehr als einer Stufe aufgerufen (Vorkurs-Themen haben nur Stufe 1 und zeigen keine Tabs)
  function zeichneTabs(id, aktiv) {
    const rec = stand[id], ist = L.istStufe(rec);
    const stufenListe = Object.keys(DATEN.themen[id].stufen).map(Number).sort((a, b) => a - b);
    const max = stufenListe[stufenListe.length - 1];
    const leiste = app.querySelector('.tabs');
    leiste.style.gridTemplateColumns = `repeat(${stufenListe.length}, 1fr)`;
    leiste.innerHTML = stufenListe.map(s => {
      const h = (rec && rec.st && rec.st[s] && rec.st[s].h) || [];
      const ok = L.sitzt(rec && rec.st && rec.st[s], s);
      const dran = !ok && s === Math.min(ist + 1, max) && ist < max;
      return `<button role="tab" id="tab-${s}" data-stufe="${s}" aria-selected="${s === aktiv}" tabindex="${s === aktiv ? 0 : -1}">
        <b>Stufe ${s}${ok ? ' <span class="ok" aria-label="sitzt">✓</span>' : ''}${dran ? ' <span class="dran">dran</span>' : ''}</b>
        <small>${STUFEN[s]}</small>
        <small class="verlauf" aria-label="letzte Versuche">${!h.length ? 'noch nicht geübt' : s === 4 ? 'Serie ' + Math.min(L.serie(h), 4) + ' von 4' : h.map(x => x ? '●' : '○').join(' ')}</small></button>`;
    }).join('');
    const knoepfe = [...leiste.querySelectorAll('[role="tab"]')];
    knoepfe.forEach((k, i) => {
      k.addEventListener('click', () => { location.hash = '#/thema/' + id + '/' + k.dataset.stufe; });
      k.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const z = knoepfe[(i + (e.key === 'ArrowRight' ? 1 : knoepfe.length - 1)) % knoepfe.length];
        z.focus();
        location.hash = '#/thema/' + id + '/' + z.dataset.stufe;
      });
    });
  }

  function teilHtml(v, t) {
    const inId = 'in-' + v.id + '-' + t.id;
    const formel = t.antwort.typ === 'formel';
    const einschaetzung = t.antwort.typ === 'einschaetzung';
    const istAuswahl = t.antwort.typ === 'auswahl';
    const schreibweise = formel
      ? `<p class="hinweis">Schreibweise: ${t.antwort.variablen.map(x => x.name === x.anzeige ? esc(x.name) : esc(x.name) + ' für ' + esc(x.anzeige)).join(', ')}, dazu pi, e, exp, sin, cos, tan, sqrt, ^ und *.</p>`
      : t.antwort.typ === 'menge' ? '<p class="hinweis">Elemente mit Komma trennen, zum Beispiel {1, 3, 8}. Leere Menge: {}</p>' : '';
    const eingabeTeil = einschaetzung
      ? `<button type="button" class="leise zeig-es">Lösung anzeigen</button>`
      : istAuswahl
      ? `<div class="auswahl" role="group" aria-labelledby="lb-${inId}">${t.antwort.optionen.map((o, i) =>
          `<button type="button" class="wahl" data-wahl="${i}">${esc(o)}</button>`).join('')}</div>`
      : `<div class="eingabe">
          <input id="${inId}" ${formel ? 'class="breit" spellcheck="false" autocapitalize="off"' : ''} autocomplete="off">
          ${t.antwort.einheit ? `<span class="einheit">${esc(t.antwort.einheit)}</span>` : ''}
          <button class="pruefen" type="button">Prüfen</button>
        </div>`;
    return `<div class="teil" data-teil="${t.id}">
      <label id="lb-${inId}" ${istAuswahl ? '' : `for="${inId}"`}>${t.id}) ${esc(t.frage)}<span class="pkt">${t.punkte} P.</span></label>
      ${t.ersatz ? `<p class="ersatz">${esc(t.ersatz)}</p>` : ''}
      ${eingabeTeil}
      ${schreibweise}
      <p class="fb" hidden aria-live="polite"></p>
      ${einschaetzung ? '' : `<button type="button" class="leise zeig" hidden>Lösung zeigen</button>`}
      <p class="loesung" hidden>${esc(t.loesung)}</p>
      ${einschaetzung ? `<div class="knoepfe-es" hidden><button type="button" class="pruefen" data-es="1">Hatte ich richtig</button><button type="button" class="leise" data-es="0">War nicht richtig</button></div>` : ''}
      ${t.nachgefragt ? `<p class="nachbohren" hidden>Nachgefragt: ${esc(t.nachgefragt)}</p>` : ''}
    </div>`;
  }

  function renderVariante(id, stufe) {
    const vs = DATEN.themen[id].stufen[stufe] || [];
    const panel = document.getElementById('panel');
    if (!vs.length) { panel.innerHTML = '<p>Für diese Stufe gibt es noch keine Aufgaben.</p>'; return; }
    const rec = stand[id];
    const n = (rec && rec.st && rec.st[stufe] && rec.st[stufe].n) || 0;
    const key = id + '|' + stufe;
    const idx = (n + (uebersprungen[key] || 0)) % vs.length;
    const v = vs[idx];
    eingabeAktiv = false;

    panel.innerHTML = `<div class="panel">
      <div class="variante-kopf"><span class="stufe-info">Variante ${idx + 1} von ${vs.length}</span><button type="button" class="leise" id="skip">Andere Variante</button></div>
      <div class="angabe">${v.angabe.map(p => `<p>${esc(p)}</p>`).join('')}${(v.formeln || []).map(f => `<span class="formel">${esc(f)}</span>`).join('')}</div>
      ${v.skizze ? '<figure><svg class="skizze" role="img" aria-label="Skizze zur Aufgabe"></svg><figcaption>' + (v.skizze.typ === 'graphen' ? 'Maßstäblich, ein Kästchen = 1' : 'Skizze (nicht maßstäblich)') + '</figcaption></figure>' : ''}
      ${v.teile.map(t => teilHtml(v, t)).join('')}
      <div class="ergebnis" id="ergebnis" hidden></div>
      <div class="anim" id="anim" hidden></div>
    </div>`;

    const erster = {};
    panel.querySelectorAll('.teil').forEach(el => {
      const t = v.teile.find(x => x.id === el.dataset.teil);
      const fb = el.querySelector('.fb'), loes = el.querySelector('.loesung'), nach = el.querySelector('.nachbohren');
      if (t.antwort.typ === 'einschaetzung') {
        const zeigEs = el.querySelector('.zeig-es'), knoepfeEs = el.querySelector('.knoepfe-es');
        zeigEs.addEventListener('click', () => { loes.hidden = false; knoepfeEs.hidden = false; zeigEs.hidden = true; });
        knoepfeEs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          if (t.id in erster) return;
          const ok = b.dataset.es === '1';
          const r = ok ? { art: 'good', text: 'Als richtig markiert.' } : { art: 'bad', text: 'Als nicht richtig markiert.' };
          fb.hidden = false;
          fb.className = 'fb ' + r.art;
          fb.textContent = r.text;
          erster[t.id] = r;
          if (nach) nach.hidden = false;
          if (Object.keys(erster).length === v.teile.length) abschliessen(id, stufe, v, erster);
        }));
        return;
      }
      const input = el.querySelector('input'), zeig = el.querySelector('.zeig');
      const pruef = wahl => {
        const typ = t.antwort.typ;
        const r = typ === 'auswahl' ? L.pruefeAuswahl(wahl, t)
          : typ === 'formel' ? L.pruefeFormel(input.value, t, window.math)
          : typ === 'menge' ? L.pruefeMenge(input.value, t) : L.pruefeZahl(input.value, t);
        if (typ === 'auswahl') el.querySelectorAll('.wahl').forEach(b => {
          b.classList.toggle('good', r.art === 'good' && b.dataset.wahl === String(wahl));
          b.classList.toggle('bad', r.art === 'bad' && b.dataset.wahl === String(wahl));
          b.setAttribute('aria-pressed', b.dataset.wahl === String(wahl) ? 'true' : 'false');
        });
        fb.hidden = false;
        fb.className = 'fb ' + r.art;
        fb.textContent = r.text;
        if (r.art === 'warn') return;
        if (!(t.id in erster)) {
          erster[t.id] = r;
          if (Object.keys(erster).length === v.teile.length) abschliessen(id, stufe, v, erster);
        }
        if (r.art === 'good') { loes.hidden = false; zeig.hidden = true; if (nach) nach.hidden = false; }
        else if (loes.hidden) zeig.hidden = false;
      };
      if (t.antwort.typ === 'auswahl') {
        el.querySelectorAll('.wahl').forEach(b => b.addEventListener('click', () => { eingabeAktiv = true; pruef(Number(b.dataset.wahl)); }));
      } else {
        input.addEventListener('input', () => { eingabeAktiv = true; });
        el.querySelector('.pruefen').addEventListener('click', () => pruef());
        input.addEventListener('keydown', e => { if (e.key === 'Enter') pruef(); });
      }
      zeig.addEventListener('click', () => { loes.hidden = false; zeig.hidden = true; });
    });
    panel.querySelector('#skip').addEventListener('click', () => {
      uebersprungen[key] = (uebersprungen[key] || 0) + 1;
      renderVariante(id, stufe);
    });
    if (v.skizze) SKIZZEN[v.skizze.typ](panel.querySelector('svg.skizze'), v.skizze);
  }

  // Gewertet wird der erste Prüfversuch jeder Teilaufgabe. Weiterprobieren darf man, es zählt nur nicht.
  function abschliessen(id, stufe, v, erster) {
    const max = Math.max(...Object.keys(DATEN.themen[id].stufen).map(Number));
    const ok = v.teile.every(t => erster[t.id].art === 'good');
    const vorher = L.istStufe(stand[id]);
    stand[id] = L.verbuche(stand[id], stufe, ok, heute());
    const nachher = L.istStufe(stand[id]);
    speichereThema(id);
    if (ok && WEB && WEB.geloest) WEB.geloest(Number(stufe));   // Wochenpunkte für die Rangliste
    logVersuch({
      v: v.id, s: stufe, ok, zeit: new Date().toISOString(),
      t: Object.fromEntries(v.teile.map(t => [t.id, erster[t.id].art])),
      fw: v.teile.map(t => erster[t.id].fehlweg).filter(Boolean),
    });

    let text = ok ? 'Diese Variante zählt als gelöst.' : 'Diese Variante zählt als nicht gelöst. Gewertet wird jeweils dein erster Versuch.';
    if (nachher > vorher) text += ' Stufe ' + nachher + ' sitzt.' + (nachher < max ? '' : max === 1 ? ' Diagnose abgeschlossen.' : ' Viermal am Stück: Das Thema ist sicher auf Klausurniveau.');
    else if (Number(stufe) === 4 && !ok && vorher === 4 && nachher < 4) text += ' Die Viererserie ist gerissen: Stufe 4 gilt erst nach vier neuen Lösungen am Stück wieder.';
    else if (Number(stufe) === 4 && !ok) text += ' Die Serie auf Stufe 4 beginnt von vorn.';
    const hist = stand[id].st[stufe].h;
    const verlauf = Number(stufe) === 4 ? 'Serie ' + Math.min(L.serie(hist), 4) + ' von 4 am Stück'
      : 'letzte Versuche: ' + hist.map(x => x ? '●' : '○').join(' ') + ' · sitzt nach einer gelösten Variante';
    const el = document.getElementById('ergebnis');
    el.hidden = false;
    el.className = 'ergebnis ' + (ok ? 'good' : 'bad');
    el.innerHTML = `<p>${esc(text)}</p><p class="verlauf">Stufe ${stufe}, ${verlauf}</p>
      <div class="knoepfe"><button type="button" class="pruefen" id="weiter">Nächste Variante</button>
      ${zufallWahl !== null ? '<button type="button" class="leise" id="zufall-weiter">Nächste zufällige Aufgabe</button>' : ''}
      ${nachher > vorher && nachher < max ? `<a class="knopf" href="#/thema/${id}/${nachher + 1}">Weiter mit Stufe ${nachher + 1}</a>` : ''}
      ${animMoeglich(v) ? '<button type="button" class="leise" id="ansehen">Veranschaulichen</button>' : ''}</div>`;
    el.querySelector('#weiter').addEventListener('click', () => {
      renderVariante(id, stufe);
      document.getElementById('panel').scrollIntoView({ block: 'start' });
    });
    const zw = el.querySelector('#zufall-weiter');
    if (zw) zw.addEventListener('click', () => zufallStarten(zufallWahl));
    const ansehen = el.querySelector('#ansehen');
    if (ansehen) ansehen.addEventListener('click', () => {
      const box = document.getElementById('anim');
      if (!box.dataset.fertig) {
        if (v.anim.typ === 'eigen') zeichneEigen(box, v.anim.A);
        else zeichneFeld(box, v.anim);
        box.dataset.fertig = '1';
      }
      box.hidden = !box.hidden;
      ansehen.textContent = box.hidden ? 'Veranschaulichen' : 'Veranschaulichung ausblenden';
      if (!box.hidden) box.scrollIntoView({ block: 'nearest' });
    });
    if (max > 1) zeichneTabs(id, stufe);
  }

  // ---------------------------------------------------------------- Animationen
  // Erscheinen erst nach dem eigenen Versuch und rechnen mit den Zahlen der Variante.
  const animMoeglich = v => !!v.anim && (v.anim.typ === 'eigen' ? !!L.eigen2(v.anim.A) : !!window.math);
  const de = (x, n = 2) => (Math.abs(x) < 0.5 * 10 ** -n ? 0 : x).toFixed(n).replace('.', ',').replace('-', '−');
  const ruhig = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  function neu(eltern, name, at, txt) {
    const e = document.createElementNS(NS, name);
    for (const k in at) e.setAttribute(k, at[k]);
    if (txt !== undefined) e.textContent = txt;
    eltern.appendChild(e);
    return e;
  }
  const pfad = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');

  function zeichneEigen(box, A) {
    const E = L.eigen2(A);
    box.innerHTML = `<figure><svg viewBox="0 0 360 360" role="img" aria-label="Wirkung der Matrix A auf alle Vektoren der Länge 1"></svg>
      <figcaption>Gestrichelt: alle Vektoren der Länge 1. Blau: ihre Bilder unter A. Grün: die Eigenrichtungen,
      auf ihnen wird nur gestreckt, nicht gedreht. Schwarz: v, orange: A·v.</figcaption></figure>
      <div class="regler">
        <label>Wirkung von A <input type="range" min="0" max="1" step="0.01" value="1" data-r="t"></label>
        <button type="button" class="leise" data-r="spiel">Abspielen</button>
        <label>Richtung von v <input type="range" min="0" max="179" step="1" value="35" data-r="w"></label>
      </div>
      <p class="anim-info" aria-live="polite"></p>`;
    const svg = box.querySelector('svg'), info = box.querySelector('.anim-info');
    const rt = box.querySelector('[data-r="t"]'), rw = box.querySelector('[data-r="w"]');
    // Größte Streckung = Wurzel des größten Eigenwerts von AᵀA; die Mischungen (1−t)·1 + t·A strecken nie mehr
    const [[a, b], [c, d]] = A;
    const s2 = L.eigen2([[a * a + c * c, a * b + c * d], [a * b + c * d, b * b + d * d]]).werte[1];
    const R = Math.max(1, Math.sqrt(s2)) * 1.15, k = 165 / R;
    const sx = x => 180 + x * k, sy = y => 180 - y * k;
    const schritt = R > 12 ? 5 : R > 6 ? 2 : 1;
    const mal = (M, p) => [M[0][0] * p[0] + M[0][1] * p[1], M[1][0] * p[0] + M[1][1] * p[1]];

    function zeichne() {
      const t = Number(rt.value), w = Number(rw.value) * Math.PI / 180;
      const At = [[1 - t + t * a, t * b], [t * c, 1 - t + t * d]];
      svg.textContent = '';
      for (let i = -Math.floor(R / schritt) * schritt; i <= R; i += schritt) {
        neu(svg, 'line', { class: i ? 'sk-gitter' : 'an-achse', x1: sx(i), x2: sx(i), y1: 0, y2: 360 });
        neu(svg, 'line', { class: i ? 'sk-gitter' : 'an-achse', y1: sy(i), y2: sy(i), x1: 0, x2: 360 });
      }
      E.vektoren.forEach((e, i) => {
        neu(svg, 'line', { class: 'an-eigen', x1: sx(-2 * R * e[0]), y1: sy(-2 * R * e[1]), x2: sx(2 * R * e[0]), y2: sy(2 * R * e[1]) });
        const lx = 0.78 * R * e[0], ly = 0.78 * R * e[1];
        neu(svg, 'text', { class: 'an-eigen-text', x: sx(lx) + 6, y: sy(ly) - 6 }, 'λ' + '₁₂'[i] + ' = ' + de(E.werte[i]));
      });
      const kreis = [], bild = [];
      for (let i = 0; i <= 96; i++) {
        const p = [Math.cos(2 * Math.PI * i / 96), Math.sin(2 * Math.PI * i / 96)];
        kreis.push([sx(p[0]), sy(p[1])]);
        const q = mal(At, p);
        bild.push([sx(q[0]), sy(q[1])]);
      }
      neu(svg, 'path', { class: 'an-bild', d: pfad(bild) + 'Z' });
      neu(svg, 'path', { class: 'an-kreis', d: pfad(kreis) + 'Z' });
      for (let i = 0; i < 12; i++) neu(svg, 'line', { class: 'an-speiche', x1: sx(0), y1: sy(0), x2: bild[i * 8][0], y2: bild[i * 8][1] });
      const v = [Math.cos(w), Math.sin(w)], Av = mal(At, v);
      neu(svg, 'line', { class: 'an-av', x1: sx(0), y1: sy(0), x2: sx(Av[0]), y2: sy(Av[1]) });
      neu(svg, 'circle', { class: 'an-av-spitze', cx: sx(Av[0]), cy: sy(Av[1]), r: 4.5 });
      neu(svg, 'line', { class: 'an-v', x1: sx(0), y1: sy(0), x2: sx(v[0]), y2: sy(v[1]) });
      neu(svg, 'circle', { class: 'an-v-spitze', cx: sx(v[0]), cy: sy(v[1]), r: 4.5 });

      // Der Text bezieht sich immer auf A selbst, der Regler zeigt nur den Weg dorthin
      const Bv = mal(A, v), laenge = Math.hypot(Bv[0], Bv[1]);
      const kreuz = v[0] * Bv[1] - v[1] * Bv[0], skalar = v[0] * Bv[0] + v[1] * Bv[1];
      const winkel = laenge < 1e-9 ? 0 : Math.atan2(Math.abs(kreuz), skalar) * 180 / Math.PI;
      info.textContent = laenge < 1e-9 || winkel < 1.5 || winkel > 178.5
        ? 'v liegt auf einer Eigenrichtung: A·v = λ·v mit λ ≈ ' + de(skalar) + '.'
        : 'A dreht v um ' + Math.round(winkel) + '°. Dreh v, bis A·v auf derselben Geraden liegt wie v.';
    }
    rt.addEventListener('input', zeichne);
    rw.addEventListener('input', zeichne);
    box.querySelector('[data-r="spiel"]').addEventListener('click', () => {
      if (ruhig()) { rt.value = 1; zeichne(); return; }
      const start = performance.now();
      const lauf = jetzt => {
        rt.value = Math.min(1, (jetzt - start) / 2500);
        zeichne();
        if (Number(rt.value) < 1) requestAnimationFrame(lauf);
      };
      requestAnimationFrame(lauf);
    });
    zeichne();
  }

  function zeichneFeld(box, an) {
    const zahl = z => (typeof z === 'number' ? z : NaN);
    const fc = window.math.compile(an.f), lc = window.math.compile(an.loesung);
    const F = (x, y) => zahl(fc.evaluate({ x, y })), Y = x => zahl(lc.evaluate({ x }));
    const [xa, xb] = an.x;
    const proben = Array.from({ length: 201 }, (_, i) => Y(xa + (xb - xa) * i / 200));
    const [ya, yb] = L.yFenster(proben, [an.y0, 0]);
    const W = 520, H = 330, RL = 34, RR = 12, RO = 12, RU = 26;
    const kx = (W - RL - RR) / (xb - xa), ky = (H - RO - RU) / (yb - ya);
    const sx = x => RL + (x - xa) * kx, sy = y => H - RU - (y - ya) * ky;
    const grenze = 20 * (yb - ya) + Math.abs(ya) + Math.abs(yb);

    box.innerHTML = `<figure><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Richtungsfeld der Differentialgleichung"></svg>
      <figcaption>Graue Striche: Steigung y′ = f(x, y) an jedem Punkt. Blau: deine Lösung. Orange gestrichelt: die
      Lösung durch den orangen Punkt. Zieh den Punkt (oder Pfeiltasten), um andere Anfangswerte auszuprobieren.</figcaption></figure>
      <div class="regler"><button type="button" class="leise" data-r="zurueck">Zurück zum Anfangswert der Aufgabe</button></div>
      <p class="anim-info" aria-live="polite"></p>`;
    const svg = box.querySelector('svg'), info = box.querySelector('.anim-info');
    svg.setAttribute('tabindex', '0');

    // fest: Gitter, Achsen, Richtungsfeld, eigene Lösung
    const fest = neu(svg, 'g', {});
    const tick = x => Math.abs(x) >= 100 ? de(x, 0) : Math.abs(x) >= 10 ? de(x, 1) : de(x, 2);
    if (ya < 0 && yb > 0) neu(fest, 'line', { class: 'an-achse', x1: sx(xa), x2: sx(xb), y1: sy(0), y2: sy(0) });
    if (xa < 0 && xb > 0) neu(fest, 'line', { class: 'an-achse', y1: sy(ya), y2: sy(yb), x1: sx(0), x2: sx(0) });
    neu(fest, 'rect', { class: 'sk-linie', x: RL, y: RO, width: W - RL - RR, height: H - RO - RU });
    neu(fest, 'text', { class: 'sk-text', x: RL, y: H - 8 }, tick(xa));
    neu(fest, 'text', { class: 'sk-text', x: W - RR, y: H - 8, 'text-anchor': 'end' }, tick(xb));
    neu(fest, 'text', { class: 'sk-text', x: (RL + W - RR) / 2, y: H - 8, 'text-anchor': 'middle' }, 'x');
    neu(fest, 'text', { class: 'sk-text', x: RL - 4, y: sy(yb) + 10, 'text-anchor': 'end' }, tick(yb));
    neu(fest, 'text', { class: 'sk-text', x: RL - 4, y: sy(ya), 'text-anchor': 'end' }, tick(ya));
    const NX = 24, NY = 15;
    for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
      const x = xa + (i + 0.5) * (xb - xa) / NX, y = ya + (j + 0.5) * (yb - ya) / NY;
      const s = F(x, y);
      let dx = 1, dy = -s * ky / kx;                       // Steigung in Bildschirmkoordinaten
      if (!Number.isFinite(dy)) { dx = 0; dy = 1; }
      const n = Math.hypot(dx, dy), l = 6.5;
      neu(fest, 'line', { class: 'an-feld', x1: sx(x) - l * dx / n, y1: sy(y) - l * dy / n, x2: sx(x) + l * dx / n, y2: sy(y) + l * dy / n });
    }
    // eigene Lösung, an Polen unterbrochen
    let d = '', offen = false;
    for (let i = 0; i <= 400; i++) {
      const x = xa + (xb - xa) * i / 400, y = Y(x);
      if (!Number.isFinite(y) || Math.abs(y) > grenze) { offen = false; continue; }
      d += (offen ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(y).toFixed(1);
      offen = true;
    }
    neu(fest, 'path', { class: 'an-loesung', d });

    // beweglich: Lösung durch den Startpunkt
    const lose = neu(svg, 'g', {});
    let x0 = an.x0, y0 = an.y0;
    function zeichne() {
      lose.textContent = '';
      const n = 700;
      const vor = L.rk4Bahn(F, x0, y0, xb, Math.max(2, Math.round(n * (xb - x0) / (xb - xa))), grenze);
      const rueck = L.rk4Bahn(F, x0, y0, xa, Math.max(2, Math.round(n * (x0 - xa) / (xb - xa))), grenze);
      const pts = rueck.punkte.slice().reverse().concat(vor.punkte.slice(1)).map(p => [sx(p[0]), sy(p[1])]);
      neu(lose, 'path', { class: 'an-bahn', d: pfad(pts) });
      neu(lose, 'circle', { class: 'an-start', cx: sx(x0), cy: sy(y0), r: 7 });
      const pole = [rueck.abbruch, vor.abbruch].filter(x => x !== null);
      const aufgabe = Math.abs(x0 - an.x0) < 1e-9 && Math.abs(y0 - an.y0) < 1e-9;
      info.textContent = 'Anfangswert y(' + de(x0) + ') = ' + de(y0) + (aufgabe ? ' wie in der Aufgabe' : '') + '. ' +
        (pole.length ? 'Diese Lösung läuft bei x ≈ ' + pole.map(x => de(x)).join(' und bei x ≈ ') + ' davon, weiter existiert sie nicht.'
          : 'Diese Lösung existiert auf dem ganzen gezeigten Bereich.');
    }
    function setze(evt) {
      const p = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(svg.getScreenCTM().inverse());
      x0 = Math.min(xb, Math.max(xa, xa + (p.x - RL) / kx));
      y0 = Math.min(yb, Math.max(ya, ya + (H - RU - p.y) / ky));
      zeichne();
    }
    let ziehen = false;
    svg.addEventListener('pointerdown', e => { ziehen = true; svg.setPointerCapture(e.pointerId); setze(e); });
    svg.addEventListener('pointermove', e => { if (ziehen) setze(e); });
    svg.addEventListener('pointerup', () => { ziehen = false; });
    svg.addEventListener('pointercancel', () => { ziehen = false; });
    svg.addEventListener('keydown', e => {
      const dx = (xb - xa) / 50, dy = (yb - ya) / 50;
      const zug = { ArrowLeft: [-dx, 0], ArrowRight: [dx, 0], ArrowUp: [0, dy], ArrowDown: [0, -dy] }[e.key];
      if (!zug) return;
      e.preventDefault();
      x0 = Math.min(xb, Math.max(xa, x0 + zug[0]));
      y0 = Math.min(yb, Math.max(ya, y0 + zug[1]));
      zeichne();
    });
    box.querySelector('[data-r="zurueck"]').addEventListener('click', () => { x0 = an.x0; y0 = an.y0; zeichne(); });
    zeichne();
  }

  // Skizze mit den Werten der Angabe, aber ohne Achsenzahlen, damit sie nichts verrät
  function zeichneWurf(svg, p) {
    svg.setAttribute('viewBox', '0 0 520 210');
    const G = 9.81, W = 520, H = 210, LI = 24, RE = 24, OB = 22, UN = 24;
    const a = p.alpha * Math.PI / 180, vx = p.v0 * Math.cos(a), vy = p.v0 * Math.sin(a);
    const tf = (vy + Math.sqrt(vy * vy + 2 * G * p.h0)) / G;
    const xmax = vx * tf * 1.06, ymax = (p.h0 + vy * vy / (2 * G)) * 1.2;
    const kx = (W - LI - RE) / xmax, ky = (H - OB - UN) / ymax;
    const sx = x => LI + x * kx, sy = y => H - UN - y * ky;
    const ns = 'http://www.w3.org/2000/svg';
    const el = (name, at, txt) => {
      const e = document.createElementNS(ns, name);
      for (const k in at) e.setAttribute(k, at[k]);
      if (txt) e.textContent = txt;
      svg.appendChild(e);
      return e;
    };
    for (let i = 0; i <= 10; i++) el('line', { class: 'sk-gitter', x1: sx(xmax * i / 10), x2: sx(xmax * i / 10), y1: sy(0), y2: sy(ymax) });
    for (let i = 1; i <= 4; i++) el('line', { class: 'sk-gitter', x1: sx(0), x2: sx(xmax), y1: sy(ymax * i / 4), y2: sy(ymax * i / 4) });
    el('line', { class: 'sk-linie', x1: sx(0), x2: sx(xmax), y1: sy(0), y2: sy(0) });
    let d = '';
    for (let i = 0; i <= 60; i++) {
      const t = tf * i / 60;
      d += (i ? 'L' : 'M') + sx(vx * t).toFixed(1) + ' ' + sy(p.h0 + vy * t - G * t * t / 2).toFixed(1);
    }
    el('path', { class: 'sk-bahn', d });
    el('line', { class: 'sk-hilfe', x1: sx(0), x2: sx(0), y1: sy(0), y2: sy(p.h0) });
    const th = vy / G, xs = sx(vx * th), ys = sy(p.h0 + vy * th - G * th * th / 2);
    el('line', { class: 'sk-hilfe', x1: xs, x2: xs, y1: sy(0), y2: ys });
    el('text', { class: 'sk-text', x: xs + 6, y: (sy(0) + ys) / 2 }, 'H = ?');
    const rx = vx * kx, ry = vy * ky, len = Math.hypot(rx, ry);
    el('line', { class: 'sk-linie', x1: sx(0), y1: sy(p.h0), x2: sx(0) + 48 * rx / len, y2: sy(p.h0) - 48 * ry / len });
    el('line', { class: 'sk-hilfe', x1: sx(0), y1: sy(p.h0), x2: sx(0) + 56, y2: sy(p.h0) });
    el('text', { class: 'sk-text', x: sx(0) + 60, y: sy(p.h0) - 6 }, p.alpha + '°');
    el('text', { class: 'sk-text', x: sx(0) + 6, y: (sy(0) + sy(p.h0)) / 2 + 4 }, 'h₀');
    el('circle', { class: 'sk-punkt', cx: sx(0), cy: sy(p.h0), r: 4 });
    el('circle', { class: 'sk-ziel', cx: sx(vx * tf), cy: sy(0), r: 4 });
    el('text', { class: 'sk-text', x: sx(vx * tf), y: sy(0) + 17, 'text-anchor': 'middle' }, 'x = ?');
  }

  // Weitere Skizzen. Jede zeigt nur Größen aus der Angabe, Gesuchtes höchstens als „?“.
  function skizzeStart(svg, W, H) {
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const ns = 'http://www.w3.org/2000/svg';
    const el = (name, at, txt) => {
      const e = document.createElementNS(ns, name);
      for (const k in at) e.setAttribute(k, at[k]);
      if (txt) e.textContent = txt;
      svg.appendChild(e);
      return e;
    };
    const defs = el('defs', {});
    const mk = document.createElementNS(ns, 'marker');
    for (const [k, w] of Object.entries({ id: 'sk-spitze', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' })) mk.setAttribute(k, w);
    const sp = document.createElementNS(ns, 'path');
    sp.setAttribute('d', 'M0 0 L10 5 L0 10 z');
    sp.setAttribute('class', 'sk-spitze');
    mk.appendChild(sp);
    defs.appendChild(mk);
    const pfeil = (x1, y1, x2, y2, cls = 'sk-pfeil', beide = false) => {
      const at = { class: cls, x1, y1, x2, y2, 'marker-end': 'url(#sk-spitze)' };
      if (beide) at['marker-start'] = 'url(#sk-spitze)';
      return el('line', at);
    };
    const decke = (x1, x2, y) => {
      el('line', { class: 'sk-linie', x1, x2, y1: y, y2: y });
      for (let x = x1 + 4; x < x2; x += 9) el('line', { class: 'sk-duenn', x1: x, y1: y, x2: x - 7, y2: y - 7 });
    };
    const feder = (x, y1, y2, n = 7, b = 8) => {
      const s = Math.min(10, (y2 - y1) / 4);
      let d = `M${x} ${y1} L${x} ${y1 + s}`;
      const h = (y2 - y1 - 2 * s) / n;
      for (let i = 0; i < n; i++) d += ` L${x + (i % 2 ? -b : b)} ${y1 + s + h * (i + 0.5)}`;
      d += ` L${x} ${y2 - s} L${x} ${y2}`;
      return el('path', { class: 'sk-linie', d });
    };
    const text = (x, y, t, anker = 'start') => el('text', { class: 'sk-text', x, y, 'text-anchor': anker }, t);
    return { el, pfeil, decke, feder, text };
  }
  const zk = x => String(x).replace('.', ',');

  // Rollender Körper auf schiefer Ebene: mit Winkel (alpha) oder mit Höhenverlust (h)
  function zeichneEbene(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 520, 230);
    const a = (p.alpha || 25) * Math.PI / 180, yb = 200, x0 = 40;
    const hg = Math.min(150, 440 * Math.tan(a)), basis = hg / Math.tan(a);
    const V = [x0 + basis, yb], T = [x0, yb - hg];
    el('path', { class: 'sk-flaeche', d: `M${T[0]} ${T[1]} L${V[0]} ${V[1]} L${x0} ${yb} Z` });
    el('line', { class: 'sk-linie', x1: 20, x2: 500, y1: yb, y2: yb });
    const r = 17, n = [Math.sin(a), -Math.cos(a)];
    const auf = s => [T[0] + s * (V[0] - T[0]) + r * n[0], T[1] + s * (V[1] - T[1]) + r * n[1]];
    const koerper = (c, cls) => {
      el('circle', { class: cls, cx: c[0], cy: c[1], r });
      el('circle', { class: 'sk-punkt', cx: c[0], cy: c[1], r: 2.5 });
    };
    const cls = p.hohl ? 'sk-hohl' : 'sk-koerper';
    if (p.h === undefined) {
      const c = auf(0.3);
      koerper(c, cls);
      const q = [c[0] + 24 * n[0], c[1] + 24 * n[1]];
      pfeil(q[0] + 30 * Math.cos(a), q[1] + 30 * Math.sin(a), q[0] + 90 * Math.cos(a), q[1] + 90 * Math.sin(a));
      text(q[0] + 96 * Math.cos(a) + 4, q[1] + 90 * Math.sin(a) - 6, 'a = ?');
      el('path', { class: 'sk-linie', d: `M${V[0] - 46} ${V[1]} A46 46 0 0 1 ${V[0] - 46 * Math.cos(a)} ${V[1] - 46 * Math.sin(a)}` });
      text(V[0] - 54 - 14, V[1] - 8 - 30 * Math.sin(a / 2), `α = ${p.alpha}°`, 'end');
    } else {
      const c1 = auf(0.06), c2 = auf(0.94);
      koerper(c1, cls);
      el('circle', { class: 'sk-hilfe', cx: c2[0], cy: c2[1], r });
      const xm = c2[0] + 40;
      el('line', { class: 'sk-hilfe', x1: c1[0], x2: xm + 6, y1: c1[1], y2: c1[1] });
      el('line', { class: 'sk-hilfe', x1: c2[0], x2: xm + 6, y1: c2[1], y2: c2[1] });
      pfeil(xm, c1[1], xm, c2[1], 'sk-pfeil', true);
      text(xm + 8, (c1[1] + c2[1]) / 2 + 4, `Δh = ${zk(p.h)} m`);
      text(c1[0] + 24, c1[1] - 22, 'Start aus der Ruhe');
      text(c2[0], c2[1] - 26, 'v = ?', 'middle');
    }
  }

  // Umlenkrolle (Masse M) mit zwei Massen
  function zeichneRolle(svg, p) {
    const { el, decke, text } = skizzeStart(svg, 380, 270);
    const cx = 190, cy = 70, R = 42;
    decke(120, 260, 14);
    el('line', { class: 'sk-linie', x1: cx, x2: cx, y1: 14, y2: cy });
    el('circle', { class: 'sk-koerper', cx, cy, r: R });
    el('circle', { class: 'sk-punkt', cx, cy, r: 3 });
    text(cx + R + 8, cy - 18, `M = ${zk(p.M)} kg`);
    text(cx + R + 8, cy - 3, 'I = ½·M·R²');
    const kiste = (x, ytop, m, name) => {
      const b = 30 + 5 * m, h = 22 + 3 * m;
      el('line', { class: 'sk-linie', x1: x, x2: x, y1: cy, y2: ytop });
      el('rect', { class: 'sk-koerper', x: x - b / 2, y: ytop, width: b, height: h });
      text(x, ytop + h + 16, `${name} = ${zk(m)} kg`, 'middle');
    };
    kiste(cx - R, 190, p.m1, 'm₁');
    kiste(cx + R, 140, p.m2, 'm₂');
  }

  // Stab mit Rakete am Ende, von oben gesehen
  function zeichneStab(svg) {
    const { el, pfeil, text } = skizzeStart(svg, 520, 210);
    const x0 = 70, x1 = 430, y = 120;
    el('rect', { class: 'sk-koerper', x: x0, y: y - 5, width: x1 - x0, height: 10 });
    el('circle', { class: 'sk-hohl', cx: x0, cy: y, r: 9 });
    el('circle', { class: 'sk-punkt', cx: x0, cy: y, r: 3 });

    pfeil(x1 + 20, y, x1 + 20, y - 70);

    text(x0 + 6, 24, 'Ansicht von oben, Stab waagerecht, Masse m');
  }

  // Zwei Federn in Reihe und parallel, Fadenpendel mit Stift
  function zeichneFedernPendel(svg, p) {
    const { el, decke, feder, text } = skizzeStart(svg, 580, 310);
    decke(30, 110, 20);
    feder(70, 20, 85); feder(70, 85, 150);
    el('rect', { class: 'sk-koerper', x: 55, y: 150, width: 30, height: 26 });
    text(70, 168, 'm', 'middle');
    text(84, 58, 'k₀'); text(84, 122, 'k₀');
    text(70, 210, 'in Reihe', 'middle');
    decke(150, 260, 20);
    feder(180, 20, 110); feder(230, 20, 110);
    el('line', { class: 'sk-linie', x1: 170, x2: 240, y1: 110, y2: 110 });
    el('line', { class: 'sk-linie', x1: 205, x2: 205, y1: 110, y2: 122 });
    el('rect', { class: 'sk-koerper', x: 190, y: 122, width: 30, height: 26 });
    text(205, 140, 'm', 'middle');
    text(160, 70, 'k₀', 'end'); text(244, 70, 'k₀');
    text(205, 210, 'parallel', 'middle');
    const px = 430, py = 30, L = 220, dp = L * p.d / p.l;
    decke(370, 490, py);
    el('line', { class: 'sk-hilfe', x1: px, x2: px, y1: py, y2: py + L });
    const a1 = 0.2, a2 = 0.2 * Math.sqrt(L / (L - dp));
    const b1 = [px - L * Math.sin(a1), py + L * Math.cos(a1)];
    el('line', { class: 'sk-linie', x1: px, y1: py, x2: b1[0], y2: b1[1] });
    el('circle', { class: 'sk-koerper', cx: b1[0], cy: b1[1], r: 9 });
    const st = [px, py + dp], b2 = [px + (L - dp) * Math.sin(a2), st[1] + (L - dp) * Math.cos(a2)];
    el('line', { class: 'sk-linie', x1: px, y1: py, x2: st[0], y2: st[1] });
    el('line', { class: 'sk-linie', x1: st[0], y1: st[1], x2: b2[0], y2: b2[1] });
    el('circle', { class: 'sk-hohl', cx: b2[0], cy: b2[1], r: 9 });
    el('circle', { class: 'sk-stift', cx: st[0], cy: st[1], r: 4.5 });
    text(st[0] + 10, st[1] + 4, 'Stift');
    text(px - 8, py + dp / 2 + 4, `${zk(p.d)} m`, 'end');
    text(b1[0] - 10, (py + b1[1]) / 2 + 30, `l = ${zk(p.l)} m`, 'end');
    text(px, py + L + 40, 'Fadenpendel mit Stift', 'middle');
  }

  // Fadenpendel oder Masse an einer Feder
  function zeichnePendel(svg, p) {

    text(166 + 6, 98, 'φ');
