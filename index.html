  }

  // Rohr, das sich verengt
  function zeichneRohr(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 540, 210);
    const y = 105, h1 = 62, h2 = 62 * p.d2 / p.d1, xa = 30, xb = 230, xc = 310, xd = 510;
    const oben = `M${xa} ${y - h1} L${xb} ${y - h1} L${xc} ${y - h2} L${xd} ${y - h2}`;
    const unten = `M${xa} ${y + h1} L${xb} ${y + h1} L${xc} ${y + h2} L${xd} ${y + h2}`;
    el('path', { class: 'sk-wasser', d: `M${xa} ${y - h1} L${xb} ${y - h1} L${xc} ${y - h2} L${xd} ${y - h2} L${xd} ${y + h2} L${xc} ${y + h2} L${xb} ${y + h1} L${xa} ${y + h1} Z` });
    el('path', { class: 'sk-wand', d: oben });
    el('path', { class: 'sk-wand', d: unten });
    pfeil(70, y, 150, y);
    text(70, y - 10, `v₁ = ${zk(p.v1)} m/s`);
    pfeil(360, y, 440, y);
    text(360, h2 < 24 ? y + h2 + 18 : y - 10, 'v₂ = ?');
    pfeil(190, y - h1, 190, y + h1, 'sk-mass', true);
    text(196, y + h1 - 8, `${p.d1} cm`);
    pfeil(470, y - h2, 470, y + h2, 'sk-mass', true);
    text(476, y + h2 + 16, `${p.d2} cm`);
    if (p.p1 !== undefined) {
      text(xa + 4, y + h1 + 22, `p₁ = ${p.p1} kPa`);
      text(xc + 20, y + h1 + 22, 'p₂ = ?');
    }
    if (p.waagerecht) text(xd, 18, 'waagerecht, reibungsfrei', 'end');
  }

  // Sinkende Kugel und Kupplungsscheiben (nicht maßstäblich)
  function zeichneKugelScheiben(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 560, 240);
    el('rect', { class: 'sk-wasser', x: 40, y: 40, width: 150, height: 170 });
    el('path', { class: 'sk-wand', d: 'M40 30 L40 210 L190 210 L190 30' });
    el('circle', { class: 'sk-koerper', cx: 115, cy: 95, r: 12 });
    pfeil(115, 112, 115, 160);
    text(124, 145, `v = ${p.v} cm/s`);
    text(130, 90, `⌀ ${p.dmm} mm`);
    text(115, 230, 'Kugel sinkt gleichförmig', 'middle');
    const xl = 330, g = 34, top = 50, bot = 190;
    el('rect', { class: 'sk-wasser', x: xl, y: top, width: g, height: bot - top });
    el('rect', { class: 'sk-koerper', x: xl - 12, y: top, width: 12, height: bot - top });
    el('rect', { class: 'sk-hohl', x: xl + g, y: top, width: 12, height: bot - top });
    el('line', { class: 'sk-linie', x1: 250, x2: xl - 12, y1: 120, y2: 120 });
    el('line', { class: 'sk-linie', x1: xl + g + 12, x2: 520, y1: 120, y2: 120 });
    el('path', { class: 'sk-hilfe', d: 'M270 104 A14 16 0 1 0 270 136', 'marker-end': 'url(#sk-spitze)' });
    text(250, 98, `f = ${zk(p.f)} Hz`, 'start');
    text(470, 110, 'fest', 'middle');
    pfeil(xl, top - 12, xl + g, top - 12, 'sk-mass', true);
    text(xl + g / 2, top - 20, `d = ${p.spalt} mm`, 'middle');
    pfeil(xl + g + 26, 120, xl + g + 26, top, 'sk-mass');
    text(xl + g + 32, 84, `R = ${p.R} cm`);
    text(xl + g / 2, 230, 'Kupplung (Spalt vergrößert)', 'middle');
  }

  // Ball, im beschleunigten Zug senkrecht hochgeschossen
  function zeichneZug(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 540, 230);
    el('line', { class: 'sk-linie', x1: 20, x2: 520, y1: 200, y2: 200 });
    el('rect', { class: 'sk-linie', x: 120, y: 50, width: 260, height: 132 });
    for (const x of [160, 340]) el('circle', { class: 'sk-hohl', cx: x, cy: 190, r: 10 });
    el('rect', { class: 'sk-koerper', x: 236, y: 160, width: 28, height: 22 });
    const hp = Math.min(96, 30 + 30 * p.h);
    el('line', { class: 'sk-hilfe', x1: 250, x2: 250, y1: 160, y2: 160 - hp });
    el('circle', { class: 'sk-koerper', cx: 250, cy: 154 - hp, r: 6 });
    pfeil(225, 160, 225, 160 - hp, 'sk-mass', true);
    text(219, 160 - hp / 2 + 4, `${zk(p.h)} m`, 'end');
    text(272, 160 - hp / 2 + 4, '(im Zug gesehen)');
    pfeil(390, 80, 460, 80);
    text(394, 70, `v_Z(t₁) = ${p.v1} m/s`);
    pfeil(390, 120, 460, 120, 'sk-pfeil-a');
    text(394, 110, `a_Z = ${p.a} m/s²`);
  }

  // Stein kreist an einer Schnur über dem Boden
  function zeichneKreisWurf(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 520, 240);
    const yb = 215, cy = yb - 70 - 25 * p.z0, cx = 200, rx = 130, ry = 30;
    el('line', { class: 'sk-linie', x1: 20, x2: 500, y1: yb, y2: yb });
    el('ellipse', { class: 'sk-hilfe', cx, cy, rx, ry });
    el('circle', { class: 'sk-punkt', cx, cy, r: 3 });
    const st = [cx + rx * Math.cos(1.1), cy + ry * Math.sin(1.1)];
    el('line', { class: 'sk-linie', x1: cx, y1: cy, x2: st[0], y2: st[1] });
    el('circle', { class: 'sk-koerper', cx: st[0], cy: st[1], r: 7 });
    text((cx + st[0]) / 2 + 4, (cy + st[1]) / 2 - 8, `R = ${zk(p.R)} m`);
    const t = [-rx * Math.sin(1.1), ry * Math.cos(1.1)], tl = Math.hypot(...t);
    pfeil(st[0], st[1], st[0] - 60 * t[0] / tl, st[1] - 60 * t[1] / tl);
    text(st[0] - 60 * t[0] / tl + 6, st[1] - 60 * t[1] / tl + 4, 'v');
    pfeil(cx - rx - 30, cy, cx - rx - 30, yb, 'sk-mass', true);
    text(cx - rx - 36, (cy + yb) / 2 + 4, `${zk(p.z0)} m`, 'end');
    el('line', { class: 'sk-hilfe', x1: cx - rx - 36, x2: cx, y1: cy, y2: cy });
    text(380, 40, `T = ${zk(p.T)} s pro Umlauf`);
    text(380, 58, 'Kreis waagerecht');
  }

  // Rakete in der Höhe h waagerecht über der Erde (nicht maßstäblich)
  function zeichneErdeRakete(svg, p) {
    const { el, pfeil, text } = skizzeStart(svg, 520, 240);
    const cx = 260, R = 520, cy = 230 + R - 60;
    el('path', { class: 'sk-flaeche', d: `M0 ${cy - Math.sqrt(R * R - 260 * 260)} A${R} ${R} 0 0 1 520 ${cy - Math.sqrt(R * R - 260 * 260)} L520 240 L0 240 Z` });
    const ry = cy - R - 90;
    el('line', { class: 'sk-hilfe', x1: cx, x2: cx, y1: ry, y2: cy - R });
    pfeil(cx + 16, ry, cx + 16, cy - R, 'sk-mass', true);
    text(cx + 22, ry + 50, `h = ${p.h} km`);
    el('path', { class: 'sk-koerper', d: `M${cx - 22} ${ry - 6} L${cx + 14} ${ry - 6} L${cx + 26} ${ry} L${cx + 14} ${ry + 6} L${cx - 22} ${ry + 6} Z` });
    pfeil(cx + 34, ry, cx + 110, ry);
    text(cx + 40, ry - 10, `v = ${p.v} m/s`);
    el('rect', { class: 'sk-koerper', x: cx - 40, y: ry + 16, width: 8, height: 8 });
    text(cx - 46, ry + 26, 'abgebrochenes Teil', 'end');
    text(cx, 228, 'Erde (R = 6400 km)', 'middle');
  }

  // Funktionsgraphen im Koordinatengitter, wie auf den MMP-Blättern. Hier sind die Achsenzahlen Teil der Angabe.
  // p = { x: [x0, x1], y: [y0, y1], kurven: [{ name, f }], punkte: [{ x, y, text }] }, f in math.js-Schreibweise.
  function zeichneGraphen(svg, p) {
    const W = 460, H = 400, R = 34;
    const { el, text } = skizzeStart(svg, W, H);
    const [xa, xb] = p.x, [ya, yb] = p.y;
    const kx = (W - 2 * R) / (xb - xa), ky = (H - 2 * R) / (yb - ya);
    const sx = x => R + (x - xa) * kx, sy = y => H - R - (y - ya) * ky;
    for (let x = Math.ceil(xa); x <= xb; x++) {
      el('line', { class: 'sk-gitter', x1: sx(x), x2: sx(x), y1: sy(ya), y2: sy(yb) });
      if (x) text(sx(x), sy(0) + 16, String(x).replace('-', '−'), 'middle');
    }
    for (let y = Math.ceil(ya); y <= yb; y++) {
      el('line', { class: 'sk-gitter', x1: sx(xa), x2: sx(xb), y1: sy(y), y2: sy(y) });
      if (y) text(sx(0) - 6, sy(y) + 4, String(y).replace('-', '−'), 'end');
    }
    el('line', { class: 'sk-achse', x1: sx(xa), x2: sx(xb) + 10, y1: sy(0), y2: sy(0), 'marker-end': 'url(#sk-spitze)' });
    el('line', { class: 'sk-achse', x1: sx(0), x2: sx(0), y1: sy(ya), y2: sy(yb) - 10, 'marker-end': 'url(#sk-spitze)' });
    text(sx(xb) + 6, sy(0) - 8, 'x');
    text(sx(0) + 8, sy(yb) - 6, 'y');
    // Kurven am Fensterrand abschneiden: Wo eine Kurve hinausläuft, endet der Pfad genau auf dem Rand
    const kurvenPunkte = p.kurven.map((k, i) => {
      const c = window.math.compile(k.f);
      const Y = x => { const y = c.evaluate({ x }); return typeof y === 'number' && Number.isFinite(y) ? y : NaN; };
      const innen = y => y >= ya && y <= yb;
      let d = '', offen = false, vx = null, vy = NaN;
      const pts = [];
      const rand = (x1, y1, x2, y2) => { const g = (y2 > yb || y1 > yb) ? yb : ya; return [x1 + (x2 - x1) * (g - y1) / (y2 - y1), g]; };
      for (let j = 0; j <= 600; j++) {
        const x = xa + (xb - xa) * j / 600, y = Y(x);
        if (innen(y)) {
          if (!offen && vx !== null && Number.isFinite(vy)) { const [rx, ry] = rand(vx, vy, x, y); d += 'M' + sx(rx).toFixed(1) + ' ' + sy(ry).toFixed(1); offen = true; }
          d += (offen ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(y).toFixed(1);
          offen = true;
          if (y > ya + 0.4 && y < yb - 0.4 && x > xa + 0.3 && x < xb - 0.5) pts.push([sx(x), sy(y)]);
        } else {
          if (offen && Number.isFinite(y)) { const [rx, ry] = rand(vx, vy, x, y); d += 'L' + sx(rx).toFixed(1) + ' ' + sy(ry).toFixed(1); }
          offen = false;
        }
        vx = x; vy = y;
      }
      el('path', { class: 'gr gr-' + (i % 5), d });
      return pts;
    });
    // Beschriftung: auf jeder Kurve die Stelle, die am weitesten von anderen Kurven, Achsen und Beschriftungen weg ist
    const gesetzt = [];
    p.kurven.forEach((k, i) => {
      if (!k.name || !kurvenPunkte[i].length) return;
      let best = null, bestWert = -1;
      for (let j = 0; j < kurvenPunkte[i].length; j += 6) {
        const [px, py] = kurvenPunkte[i][j];
        for (const [ox, oy] of [[9, -9], [-17, -9], [9, 18], [-17, 18]]) {
          const lx = px + ox + 4, ly = py + oy - 5;           // Mitte des Buchstabens
          // Achsen samt Zahlen (links der y-Achse, unter der x-Achse) und Fensterrand meiden
          let abstand = Math.min(Math.abs(lx - sx(0)), Math.abs(lx - sx(0) + 14), Math.abs(ly - sy(0)), Math.abs(ly - sy(0) - 12),
            lx - sx(xa), sx(xb) - lx, ly - sy(yb), sy(ya) - ly, 60);
          kurvenPunkte.forEach((pts, ii) => {
            const fern = ii === i ? 8 : 0;   // zur eigenen Kurve hält der Versatz ohnehin Abstand
            for (let m = 0; m < pts.length; m += 3) abstand = Math.min(abstand, Math.hypot(pts[m][0] - lx, pts[m][1] - ly) + fern * 3);
          });
          for (const [gx, gy] of gesetzt) abstand = Math.min(abstand, Math.hypot(gx - lx, gy - ly) / 2);
          for (const q of p.punkte || []) abstand = Math.min(abstand, Math.hypot(sx(q.x) + 10 - lx, sy(q.y) - ly) / 1.5);
          if (abstand > bestWert) { bestWert = abstand; best = [px + ox, py + oy, lx, ly]; }
        }
      }
      gesetzt.push([best[2], best[3]]);
      el('text', { class: 'grt grt-' + (i % 5), x: best[0], y: best[1] }, k.name);
    });
    for (const q of p.punkte || []) {
      el('circle', { class: 'sk-punkt', cx: sx(q.x), cy: sy(q.y), r: 4 });
      if (q.text) text(sx(q.x) + 8, sy(q.y) + (q.y > (ya + yb) / 2 ? 18 : -10), q.text);
    }
  }

  const SKIZZEN = {
    graphen: zeichneGraphen,
    wurf: zeichneWurf, ebene: zeichneEbene, rolle: zeichneRolle, stab: zeichneStab, federnPendel: zeichneFedernPendel,
    pendel: zeichnePendel, rohr: zeichneRohr, kugelScheiben: zeichneKugelScheiben, zug: zeichneZug,
    kreisWurf: zeichneKreisWurf, erdeRakete: zeichneErdeRakete,
  };

  route();
  verbinde();
})();
</script>
